<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX 2026 카탈로그</title>
<meta name="description" content="요넥스 2026 배드민턴·테니스 용품 디지털 카탈로그 — 라켓, 신발, 스트링, 셔틀콕 전체 상품을 한눈에 검색하고 비교하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="YONEX 2026 GEAR CATALOGUE">
<meta property="og:description" content="요넥스 2026 배드민턴·테니스 용품 디지털 카탈로그">
<meta property="og:image" content="images/header-banner.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='69' font-family='Arial,sans-serif' font-weight='900' font-size='58' fill='%238cff5c' text-anchor='middle'>Y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#111111;
    --navy-deep:#000000;
    --blue:#1656c9;
    --green:#8cff5c;
    --ease:cubic-bezier(.22,1,.36,1);
    --red:#e01130;
    --ink:#0a0a0a;
    --paper:#f5f5f7;
    --card:#ffffff;
    --line:#e6e6e6;
    --muted:#6f6f6f;
    --radius:8px;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);overflow-x:hidden;}
  a{color:inherit;}
  img{max-width:100%;}

  /* ---------- HERO / LANDING ---------- */
  body.hero-active{overflow:hidden;}
  .hero{
    position:fixed;inset:0;z-index:300;overflow-y:auto;isolation:isolate;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
    text-align:left;color:#fff;padding:40px 26px 56px;
    background:linear-gradient(180deg,#000000,#141414);
    transition:transform .55s cubic-bezier(.65,0,.35,1), opacity .45s ease;
  }
  .hero.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
  .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
  .hero-photo-overlay{
    position:absolute;inset:0;z-index:-2;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.88) 100%);
  }
  .hero-badge-row{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
  .hero-logo{font-weight:900;font-size:16px;letter-spacing:.2px;}
  .hero-yr{font-size:16px;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.2px;}
  .hero-title{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1.05;margin:4px 0 18px;max-width:320px;letter-spacing:-.02em;}
  .hero-sub{font-size:14px;color:#e4e4e6;max-width:280px;line-height:1.6;margin-bottom:3px;}
  .hero-stats{font-size:12px;color:#c2c2c6;margin-bottom:26px;}
  .hero-cta{
    background:#fff;color:var(--navy-deep);font-weight:800;font-size:15px;
    padding:14px 32px;border-radius:999px;border:none;cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:22px;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .hero-cta:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(0,0,0,.32);}
  .hero-cta:active{transform:translateY(0) scale(.96);}
  .hero-cats{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;justify-content:flex-start;max-width:300px;}
  .hero-cats button{
    background:none;border:none;color:rgba(255,255,255,.82);
    padding:0;font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    cursor:pointer;display:inline-flex;align-items:center;transition:color .15s ease;
  }
  .hero-cats button:not(:first-child)::before{content:'·';margin:0 10px;color:rgba(255,255,255,.35);font-weight:400;}
  .hero-cats button:hover{color:#fff;}
  @media print{ .hero{display:none !important;} }

  @keyframes heroTextIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .hero-badge-row{animation:heroTextIn .85s var(--ease) both;}
  .hero-title{animation:heroTextIn .85s var(--ease) .12s both;}
  .hero-sub{animation:heroTextIn .85s var(--ease) .3s both;}
  .hero-stats{animation:heroTextIn .85s var(--ease) .38s both;}

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky;top:0;z-index:50;overflow:hidden;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    color:#1d1d1f;
    padding:24px 16px 0;
    border-bottom:1px solid #d2d2d7;
  }
  header.top .brandrow, header.top .searchwrap, header.top nav.cats, header.top nav.subcats{
    position:relative;z-index:2;
  }
  .brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between;}
  .brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto;}
  .brand .logo{font-weight:900;font-size:27px;letter-spacing:-.02em;color:#1d1d1f;}
  .brand .yr{
    font-size:11px;background:transparent;color:#6e6e73;font-weight:700;
    padding:0;letter-spacing:.02em;line-height:1;opacity:.8;
    border:none;
    display:inline-flex;align-items:center;
  }
  .header-logo{flex:0 0 auto;display:flex;align-items:center;}
  .header-logo img{height:20px;width:auto;display:block;}
  @media(max-width:400px){.header-logo img{height:16px;}}
  .searchwrap{margin:18px 0 16px;}
  .searchbox{
    display:flex;align-items:center;gap:8px;
    background:#f5f5f7;border:1px solid transparent;
    border-radius:980px;padding:7px 14px;
  }
  .searchbox input{
    background:transparent;border:none;outline:none;color:#1d1d1f;
    font-size:16px;width:111.12%;transform:scale(.9);transform-origin:left center;
  }
  .searchbox input::placeholder{color:#86868b;}
  .searchbox svg{flex:none;opacity:.7;color:#6e6e73;width:14px;height:14px;}

  .to-top{
    position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;
    width:46px;height:46px;border-radius:50%;
    background:#000;border:1px solid rgba(255,255,255,.18);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(0,0,0,.4);cursor:pointer;
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .to-top.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .to-top:hover{background:#1a1a1a;}
  .to-top:active{background:#000;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  @media print{ .to-top{display:none !important;} }

  .compare-bar{
    position:fixed;left:16px;right:74px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:59;
    background:#000;border:1px solid rgba(255,255,255,.18);border-radius:999px;
    padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .compare-bar.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .compare-bar .cb-label{color:#fff;font-size:12px;font-weight:700;white-space:nowrap;transition:color .15s ease;}
  .compare-bar .cb-cta{
    background:#fff;color:#1d1d1f;font-weight:800;font-size:12px;
    border:none;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;
    transition:opacity .15s ease,transform .1s ease;
  }
  .compare-bar .cb-cta:active{transform:scale(.96);}
  .compare-bar .cb-cta:disabled{opacity:.35;cursor:default;}
  .compare-bar .cb-clear{
    background:transparent;border:none;color:#8a8a8a;font-size:15px;line-height:1;cursor:pointer;
    padding:6px 8px;flex:none;
  }
  .compare-bar .cb-clear:hover{color:#fff;}
  @media print{ .compare-bar{display:none !important;} }

  nav.cats{
    display:flex;gap:10px;overflow-x:auto;padding:0 0 10px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats button{
    flex:none;white-space:nowrap;
    background:transparent;color:#3d3d40;border:1.5px solid #d2d2d7;
    padding:8px 17px;border-radius:980px;font-size:13px;font-weight:800;cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease,transform .1s ease;
  }
  nav.cats button:hover{color:#1d1d1f;border-color:#adadb2;}
  nav.cats button:active{transform:scale(.96);}
  nav.cats button.active{
    background:#1d1d1f;color:#fff;border-color:#1d1d1f;
  }
  nav.cats button.active:hover{background:#1d1d1f;color:#fff;}

  nav.subcats{
    display:flex;gap:30px;overflow-x:auto;padding:0 0 16px;margin-top:0;
    scrollbar-width:none;
  }
  nav.subcats::-webkit-scrollbar{display:none;}
  nav.subcats button{
    flex:none;white-space:nowrap;background:transparent;color:#86868b;
    border:none;padding:7px 2px;font-size:13.5px;font-weight:700;cursor:pointer;
    border-bottom:3px solid transparent;transition:color .15s ease,border-bottom-color .15s ease;
  }
  nav.subcats button:hover{color:#1d1d1f;}
  nav.subcats button.active{color:#1d1d1f;border-bottom-color:#34c759;}
  nav.subcats button.active:hover{color:#1d1d1f;}

  nav.cats.has-more, nav.subcats.has-more, .serieswrap.has-more, .cmp-table-wrap.has-more{
    -webkit-mask-image:linear-gradient(to right, black calc(100% - 28px), transparent);
    mask-image:linear-gradient(to right, black calc(100% - 28px), transparent);
  }

  /* ---------- SERIES CHIPS ---------- */
  .filter-mode-tabs{padding:12px 16px 0;display:flex;gap:18px;}
  .filter-mode-tabs:empty{padding:0;}
  .filter-mode-tabs button{
    background:none;border:none;padding:2px 0 6px;font-size:12.5px;font-weight:700;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;transition:color .15s ease,border-bottom-color .15s ease;
  }
  .filter-mode-tabs button:hover{color:var(--ink);}
  .filter-mode-tabs button.active{color:var(--ink);border-bottom-color:var(--navy);}
  .serieswrap{padding:12px 16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .serieswrap::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
    background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;
    transition:border-color .15s ease,color .15s ease;
  }
  .chip:hover{border-color:var(--muted);color:var(--ink);}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .chip.active:hover{border-color:var(--navy);color:#fff;}

  :focus-visible{outline:2px solid var(--green);outline-offset:2px;}
  #origPdfBtn, #shareBtn{transition:opacity .15s ease,transform .1s ease;}
  #origPdfBtn:hover, #shareBtn:hover{opacity:.85;}
  #origPdfBtn:active, #shareBtn:active{transform:scale(.96);}

  main{padding:14px 16px 60px;max-width:1100px;margin:0 auto;}

  /* ---------- SERIES INFO (header + map entry) ---------- */
  .series-hero{
    border-radius:16px;padding:18px 20px 18px;color:#fff;margin:14px 0 12px;
    position:relative;overflow:hidden;
  }
  .series-hero .sh-kicker{font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;color:#fff;}
  .series-hero .sh-title{font-size:clamp(18px,6.1vw,24px);font-weight:900;line-height:1.05;margin:6px 0 8px;letter-spacing:-.03em;white-space:nowrap;}
  .series-hero .sh-desc{font-size:13px;line-height:1.5;opacity:.92;max-width:340px;margin-bottom:14px;}
  .series-hero .sh-cta{
    display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1d1d1f;font-weight:800;font-size:12px;
    border:none;border-radius:999px;padding:8px 15px;cursor:pointer;transition:opacity .15s ease,transform .1s ease;
  }
  .series-hero .sh-cta:hover{opacity:.92;}
  .series-hero .sh-cta:active{transform:scale(.96);}

  .smap-wrap{padding:0 0 26px;}
  .smap-head{
    display:flex;align-items:center;gap:10px;padding:16px 16px 4px;position:sticky;top:0;background:#fff;z-index:2;
  }
  .smap-head button{
    flex:none;width:34px;height:34px;border-radius:50%;border:none;background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  }
  .smap-head h2{flex:1;text-align:center;font-size:14px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--ink);}
  .smap-svg{display:block;width:100%;height:auto;padding:8px 4px 4px;box-sizing:border-box;}
  .smap-svg .smap-bubble{cursor:pointer;}
  .smap-svg .smap-bubble circle{transition:r .15s ease;}
  .smap-svg .smap-bubble:hover circle{r:16;}
  .smap-svg .smap-draggable{cursor:grab;touch-action:none;}
  .smap-svg .smap-draggable:active{cursor:grabbing;}
  .smap-svg .smap-draggable circle{stroke-width:2.5;}
  .smap-svg text{font-family:'Archivo',-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;}
  .smap-admin-bar{
    display:flex;align-items:center;gap:10px;margin:0 16px 16px;padding:12px 14px;
    background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;
  }
  .smap-admin-hint{flex:1;font-size:11.5px;line-height:1.5;color:#9a3412;}
  .smap-admin-bar button{
    flex:none;background:#1d1d1f;color:#fff;font-weight:800;font-size:12.5px;
    border:none;border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;
  }

  .section-title{
    font-size:13px;font-weight:900;color:var(--ink);text-transform:uppercase;
    letter-spacing:.08em;margin:34px 0 16px;display:flex;align-items:center;gap:8px;
  }
  .section-title .bar{display:none;}
  .count{color:var(--muted);font-size:12px;text-align:right;margin:6px 0 0;}

  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:13px;
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--card);border:none;border-radius:14px;
    padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease;
  }
  .card.card-enter{animation:cardIn .85s var(--ease) both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card:active{transform:translateY(0) scale(.96);}
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 16px 32px rgba(0,0,0,.1);}
  .card .thumb{
    aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;position:relative;overflow:hidden;
  }
  .card .thumb .thumb-icon-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;width:100%;height:100%;padding:8px;
  }
  .card .thumb svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .card .thumb .thumb-label{font-size:11px;font-weight:800;letter-spacing:.03em;opacity:.9;}
  .sheet-hero svg{width:76px;height:76px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));}
  .badge-new{
    display:inline-flex;white-space:nowrap;flex:none;
    background:#fff;color:#7c3aed;border:1.2px solid #7c3aed;
    border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:-.01em;
    padding:2.4px 7.5px;
  }
  .badge-new.design{color:var(--blue);border-color:var(--blue);}
  .card-top{position:relative;}
  .card.cmp-selected{box-shadow:0 0 0 2px #1d1d1f,0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05);}
  .cmp-toggle{
    position:absolute;top:-10px;right:-10px;z-index:2;
    width:26px;height:26px;border-radius:50%;
    background:#fff;border:1.5px solid rgba(0,0,0,.12);color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    transition:background .15s ease,border-color .15s ease,transform .1s ease,opacity .15s ease;
  }
  .cmp-toggle:hover{background:#fff;}
  .cmp-toggle:active{transform:scale(.96);}
  .cmp-toggle.active{background:#1d1d1f;border-color:#1d1d1f;color:#fff;}
  .cmp-toggle.muted{opacity:.3;}
  .cmp-icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:.55;transform:scale(1);filter:blur(0);
    transition:opacity .2s cubic-bezier(.2,0,0,1),transform .2s cubic-bezier(.2,0,0,1),filter .2s cubic-bezier(.2,0,0,1);
  }
  .cmp-icon-check{opacity:0;transform:scale(.25);filter:blur(4px);}
  .cmp-toggle.active .cmp-icon-plus{opacity:0;transform:scale(.25);filter:blur(4px);}
  .cmp-toggle.active .cmp-icon-check{opacity:1;transform:scale(1);filter:blur(0);}
  .cmp-coach{
    display:none;position:absolute;z-index:65;max-width:200px;
    align-items:center;gap:6px;background:var(--ink);color:#fff;
    padding:9px 10px 9px 12px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.3);
    font-size:11.5px;font-weight:700;line-height:1.4;
    animation:cmpCoachIn .25s ease-out;
    opacity:1;transform:translateY(0);
    transition:opacity .18s ease,transform .18s ease;
  }
  .cmp-coach.leaving{opacity:0;transform:translateY(-4px);}
  @keyframes cmpCoachIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .cmp-coach-arrow{
    position:absolute;bottom:-6px;width:12px;height:12px;background:var(--ink);
    transform:rotate(45deg);border-radius:2px;
  }
  .cmp-coach-close{
    flex:none;background:none;border:none;color:rgba(255,255,255,.6);font-size:11px;
    cursor:pointer;padding:2px;line-height:1;
  }
  .cmp-coach-close:hover{color:#fff;}
  .card .series-tag{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;}
  .card .name{font-size:14px;font-weight:900;line-height:1.25;color:var(--ink);text-transform:uppercase;letter-spacing:-.01em;margin-top:2px;}
  .card .kr{font-size:11.5px;color:var(--muted);margin-top:-4px;}
  .card .price{margin-top:auto;padding-top:4px;font-size:15px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .card .price small{font-weight:600;color:var(--muted);font-size:11px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
  }

  /* ---------- SERIES DIVIDER ---------- */
  .series-divider{
    grid-column:1 / -1;position:relative;overflow:hidden;
    aspect-ratio:3/1;min-height:240px;max-height:480px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;text-align:center;
    width:100vw;margin:56px calc(50% - 50vw) 56px;
  }
  .series-divider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .series-divider .sd-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.32),rgba(0,0,0,.1));}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,15,35,.55);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .55s var(--ease),visibility 0s linear .55s;
  }
  .overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s var(--ease);}
  @media(min-width:720px){.overlay{align-items:center;}}
  .sheet{
    background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;
    max-height:88vh;overflow-y:auto;padding:0 0 24px;position:relative;
    animation:up .7s var(--ease);
  }
  @media(min-width:720px){.sheet{border-radius:20px;max-height:80vh;}}
  @media(min-width:720px){.sheet.cmp-mode{max-width:900px;}}
  @keyframes up{from{transform:translateY(16px) scale(.99);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .finder-wrap,.cmp-wrap{animation:panelIn .6s var(--ease);}

/* =============== COLOR DOTS (tennis shoes with multiple colorways) =============== */
const COLOR_MAP = {
  'ruby red':'#9b1c31','dark red':'#8b1a1a','red':'#d0342c',
  'white':'#ffffff','black':'#111111',
  'blue':'#2563eb','navy':'#1e2a4a','dark navy':'#141c33',
  'sky blue':'#7ec8e3','sax':'#8fc1e3','pale blue':'#cfe3f7',
  'green':'#2e8b57','dark green':'#1f5c3a','teal green':'#0f766e',
  'lime':'#a3d63f','fresh lime':'#b6e23a','sunny lime':'#cdeb4a',
  'orange':'#f0632a','sherbet orange':'#ffb37a','white orange':'#f5a35a',
  'purple':'#7c3aed','pink':'#f4a6c6','pale pink':'#fbd6e6',
  'brown':'#6b4a34','mocha gray':'#8a7a6d','mocha grey':'#8a7a6d',
  'gray':'#9aa0a8','grey':'#9aa0a8','silver':'#c8ccd1','silver orange':'#e8c39a',
  'gold':'#caa64d','champagne':'#f0dfc0','khaki':'#8f8757','sand beige':'#d8c39a',
  'yellow':'#f2d024','mint':'#8fe3c0',
};
function colorToHex(word){
  const key = (word||'').trim().toLowerCase();
  if(!key) return '#cbd5e1';
  if(COLOR_MAP[key]) return COLOR_MAP[key];
  const parts = key.split(' ');
  for(let i=parts.length-1;i>=0;i--){
    if(COLOR_MAP[parts[i]]) return COLOR_MAP[parts[i]];
  }
  return '#cbd5e1';
}
function extractColorGroups(raw){
  if(!raw) return [];
  const bracketRe = /\[(\d{4})\]\s*([^\[]*)/g;
  let m, groups = [], matched = false;
  while((m = bracketRe.exec(raw))){
    matched = true;
    const content = m[2].replace(/\/\s*$/,'').trim();
    content.split(',').map(s=>s.trim()).filter(Boolean).forEach(t=>groups.push(t));
  }
  if(!matched){
    raw.split(',').map(s=>s.trim()).filter(Boolean).forEach(t=>groups.push(t));
  }
  return groups;
}
function colorDotHtml(token){
  token = token.replace(/\/\s*$/,'').trim();
  const subs = token.split('/').map(s=>s.trim()).filter(Boolean);
  const esc = token.replace(/"/g,'&quot;');
  if(subs.length>=2){
    const c1 = colorToHex(subs[0]), c2 = colorToHex(subs[1]);
    return `<span class="color-dot" title="${esc}" style="background:linear-gradient(135deg, ${c1} 50%, ${c2} 50%);"></span>`;
  }
  const c = colorToHex(subs[0]||token);
  return `<span class="color-dot" title="${esc}" style="background:${c};"></span>`;
}
function colorDotsRow(p){
  const raw = p.specs && p.specs['색상'];
  const groups = extractColorGroups(raw);
  if(groups.length<1) return '';
  const maxDots = 4;
  const shown = groups.slice(0,maxDots).map(colorDotHtml).join('');
  const extra = groups.length>maxDots? `<span class="color-more">+${groups.length-maxDots}</span>` : '';
  return `<div class="color-dots">${shown}${extra}</div>`;
}

function applyBulkLinks(){
  const raw = document.getElementById('bulkInput').value.trim();
  if(!raw){ document.getElementById('bulkResult').textContent='붙여넣은 내용이 없어요.'; return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let okLinks=0, okImages=0, fail=[];
  lines.forEach(line=>{
    // split only on the FIRST tab (or comma if no tab) so multiple image names
    // separated by semicolons later in the value are never cut off
    const tabIdx = line.indexOf('\t');
    let key, value;
    if(tabIdx > -1){
      key = line.slice(0, tabIdx).trim();
      value = line.slice(tabIdx+1).trim();
    } else {
      const commaIdx = line.indexOf(',');
      if(commaIdx === -1){ fail.push(line); return; }
      key = line.slice(0, commaIdx).trim();
      value = line.slice(commaIdx+1).trim();
    }
    if(!key || !value){ fail.push(line); return; }
    key = key.replace(/^images\//,'').replace(/\.(jpg|jpeg|png|webp)$/i,'');
    const slug = slugify(key);
    const product = SLUG_MAP[slug];
    if(!product){ fail.push(line); return; }

    if(/^https?:\/\//i.test(value)){
      // a single URL -> Yonexmall link
      product.buyUrl = value;
      okLinks++;
    } else {
      // one or more image filenames, separated by ; (or a single one alone)
      const files = value.split(';').map(s=>s.trim()).filter(Boolean)
        .map(f=> /^https?:\/\//i.test(f) ? f : (f.startsWith('images/') ? f : 'images/'+f));
      if(files.length===0){ fail.push(line); return; }
      if(files.length===1){
        product.img = files[0];
      } else {
        product.images = files;
        product.img = files[0];
      }
      okImages++;
    }
  });
  document.getElementById('bulkResult').innerHTML =
    `✅ 링크 ${okLinks}개, 이미지 ${okImages}개 적용 완료.` +
    (fail.length? `<br>⚠️ 매칭 실패 ${fail.length}개 (파일명 확인 필요): <br>` + fail.slice(0,8).map(f=>`<code>${f}</code>`).join('<br>') : '');
  renderGrid(); // refresh so buy buttons are ready to preview immediately
}

function exportUpdatedHtml(){
  if(!ORIGINAL_HTML){ alert('페이지가 아직 완전히 로드되지 않았어요. 잠시 후 다시 시도해주세요.'); return; }
  const newArrayText = 'const P = ' + JSON.stringify(P) + ';';
  const patched = ORIGINAL_HTML.replace(/const P = \[[\s\S]*?\n\];/, newArrayText);
  if(patched === ORIGINAL_HTML){
    alert('내보내기에 실패했어요. 페이지를 새로고침한 뒤 다시 시도해주세요.');
    return;
  }
  const blob = new Blob(['<!DOCTYPE html>\n'+patched], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yonex-2026-catalog-updated.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function annotateTech(text){
  if(!text) return text;
  let allKeys = [];
  TECH_GLOSSARY.forEach((entry, idx)=>{
    entry.keys.forEach(k=> allKeys.push({key:k, idx}));
  });
  allKeys.sort((a,b)=> b.key.length - a.key.length);

  let segments = [{text: text, isTag:false}];
  allKeys.forEach(({key, idx})=>{
    const re = new RegExp(escapeRegex(key), 'gi');
    segments = segments.flatMap(seg=>{
      if(seg.isTag) return [seg];
      let out = [];
      let lastIndex = 0, m;
      re.lastIndex = 0;
      while((m = re.exec(seg.text))){
        if(m.index > lastIndex) out.push({text:seg.text.slice(lastIndex, m.index), isTag:false});
        out.push({isTag:true, html:`<span class="tech-term">${m[0]}</span><span class="tech-info" data-tech="${idx}" onclick="showTechPopover(event,${idx})">i</span>`});
        lastIndex = m.index + m[0].length;
        if(re.lastIndex === m.index) re.lastIndex++;
      }
      out.push({text:seg.text.slice(lastIndex), isTag:false});
      return out;
    });
  });
  return segments.map(s=> s.isTag? s.html : s.text).join('');
}

function showTechPopover(evt, idx){
  evt.stopPropagation();
  const entry = TECH_GLOSSARY[idx];
  const pop = document.getElementById('techPopover');
  document.getElementById('techPopoverTitle').textContent = entry.label;
  document.getElementById('techPopoverDesc').textContent = entry.desc;
  const rect = evt.target.getBoundingClientRect();
  const popW = 260;
  let left = rect.left - popW/2 + rect.width/2;
  left = Math.max(10, Math.min(left, window.innerWidth - popW - 10));
  let top = rect.bottom + 8;
  if(top > window.innerHeight - 100) top = rect.top - 90;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.display = 'block';
}
function closeTechPopover(){
  document.getElementById('techPopover').style.display = 'none';
}
function shareCatalog(){
  const url = window.location.href;
  if(navigator.share){
    navigator.share({title:document.title, url}).catch(()=>{});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>{
      alert('링크가 복사되었습니다.');
    }).catch(()=>{
      prompt('아래 링크를 복사하세요:', url);
    });
    return;
  }
  prompt('아래 링크를 복사하세요:', url);
}
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('techPopover');
  if(pop.style.display === 'block' && !pop.contains(e.target) && !e.target.classList.contains('tech-info')){
    closeTechPopover();
  }
});

  if(!el) return;
  el.classList.toggle('has-more', el.scrollWidth > el.clientWidth + 1);
}

  return (cat==='bad' && sub==='string') ? 'type' : 'series';

  state.typeFilter=null; state.gaugeFilter=null;
  state.filterMode = defaultFilterModeFor(state.cat, state.sub);

  const el = document.getElementById('catNav');
  el.innerHTML = CATS.map(c=>`<button data-cat="${c.id}" class="${c.id===state.cat?'active':''}">${c.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.cat=b.dataset.cat; state.sub=SUBCATS[state.cat][0].id; state.q='';
    resetFilters();
    document.getElementById('searchInput').value='';

    resetFilters();
    renderAll();

function racquetFlex(p){
  return (p.specs && p.specs['탄성']) || null;
}
function filterModesFor(cat, sub, items){
  if(cat==='bad' && sub==='racquet'){
    const modes = [['series','시리즈']];
    if(items.some(p=>racquetWeights(p).length)) modes.push(['weight','무게']);
    if(items.some(p=>racquetFlex(p))) modes.push(['flex','탄성']);
    return modes;
  }
  if(cat==='bad' && sub==='string'){
    const modes = [];
    if(items.some(p=>stringType(p))) modes.push(['type','유형']);
    if(items.some(p=>stringGaugeBucket(stringGaugeMm(p)))) modes.push(['gauge','굵기']);
    if(modes.length) modes.push(['series','시리즈']);
    return modes;
  }
  return [];
}

  const items = P.filter(p=>p.c===state.cat && p.s===state.sub);
  const modes = filterModesFor(state.cat, state.sub, items);
  if(modes.length<=1){ el.innerHTML=''; return; }
  el.innerHTML = modes.map(([m,label])=>`<button data-mode="${m}" class="${state.filterMode===m?'active':''}">${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.filterMode = b.dataset.mode;
    state.series=null; state.weightFilter=null; state.flexFilter=null;
    state.typeFilter=null; state.gaugeFilter=null;
    renderSeriesRow(); renderGrid();
    el.querySelectorAll('button').forEach(x=>x.classList.remove('active'));

function renderSeriesRow(){
  const el = document.getElementById('seriesRow');
  if(state.q){ el.innerHTML=''; syncScrollFade(el); return; }
  const items = P.filter(p=>p.c===state.cat && p.s===state.sub);
  const modes = filterModesFor(state.cat, state.sub, items);
  const modeIds = modes.map(m=>m[0]);
  const mode = modeIds.includes(state.filterMode) ? state.filterMode : 'series';

  if(mode==='weight'){
    const buckets = ['가벼운','보통','묵직한'].filter(w=> items.some(p=>racquetWeights(p).map(weightBucket).includes(w)));
    el.innerHTML = buckets.map(w=>`<button class="chip ${state.weightFilter===w?'active':''}" data-weight="${w}">${w}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      state.weightFilter = (state.weightFilter===b.dataset.weight) ? null : b.dataset.weight;
      renderGrid();
      el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x.dataset.weight===state.weightFilter));
    });
    syncScrollFade(el);
    return;
  }
  if(mode==='flex'){
    const flexOrder = ['HI-FLEX','MEDIUM','STIFF','EXTRA STIFF'];
    const flexList = flexOrder.filter(f=> items.some(p=>racquetFlex(p)===f));
    el.innerHTML = flexList.map(f=>`<button class="chip ${state.flexFilter===f?'active':''}" data-flex="${f}">${f}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      state.flexFilter = (state.flexFilter===b.dataset.flex) ? null : b.dataset.flex;
      renderGrid();
      el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x.dataset.flex===state.flexFilter));
    });
    syncScrollFade(el);
    return;
  }
  if(mode==='type'){
    const typeOrder = ['반발력','내구성','타구음','충격흡수력','컨트롤'];
    const typeList = typeOrder.filter(t=> items.some(p=>stringType(p)===t));
    el.innerHTML = `<button class="chip ${!state.typeFilter?'active':''}" data-type="">전체</button>` +
      typeList.map(t=>`<button class="chip ${state.typeFilter===t?'active':''}" data-type="${t}">${STRING_TYPE_LABELS[t]}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      state.typeFilter = b.dataset.type || null; renderGrid();
      el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
    syncScrollFade(el);
    return;
  }
  if(mode==='gauge'){
    const gaugeOrder = ['얇은','보통','두꺼운'];
    const gaugeList = gaugeOrder.filter(g=> items.some(p=>stringGaugeBucket(stringGaugeMm(p))===g));
    el.innerHTML = `<button class="chip ${!state.gaugeFilter?'active':''}" data-gauge="">전체</button>` +
      gaugeList.map(g=>`<button class="chip ${state.gaugeFilter===g?'active':''}" data-gauge="${g}">${g}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      state.gaugeFilter = b.dataset.gauge || null; renderGrid();
      el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
    syncScrollFade(el);
    return;
  }

  const seriesList = [...new Set(items.map(p=>p.series))];
  if(seriesList.length<=1){ el.innerHTML=''; syncScrollFade(el); return; }
  el.innerHTML = `<button class="chip ${!state.series?'active':''}" data-series="">전체</button>` +
    seriesList.map(s=>`<button class="chip ${state.series===s?'active':''}" data-series="${s}">${s}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    state.series = b.dataset.series || null; renderGrid();
    el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
  syncScrollFade(el);
}

function currentList(){
  let list;
  if(state.q){
    const q = state.q.toLowerCase();
    list = P.filter(p=> (p.name+p.kr+p.series).toLowerCase().includes(q));
  } else {
    list = P.filter(p=>p.c===state.cat && p.s===state.sub);
    if(state.cat==='bad' && state.sub==='racquet' && state.filterMode==='weight' && state.weightFilter){
      list = list.filter(p=>racquetWeights(p).map(weightBucket).includes(state.weightFilter));
    } else if(state.cat==='bad' && state.sub==='racquet' && state.filterMode==='flex' && state.flexFilter){
      list = list.filter(p=>racquetFlex(p)===state.flexFilter);
    } else if(state.cat==='bad' && state.sub==='string' && state.filterMode==='type' && state.typeFilter){
      list = list.filter(p=>stringType(p)===state.typeFilter);
    } else if(state.cat==='bad' && state.sub==='string' && state.filterMode==='gauge' && state.gaugeFilter){
      list = list.filter(p=>stringGaugeBucket(stringGaugeMm(p))===state.gaugeFilter);
    } else if(state.series){
      list = list.filter(p=>p.series===state.series);
    }
  }
  if(state.newOnly){
    list = list.filter(p=>p.badge);
  }
  if(state.sort==='desc' || state.sort==='asc'){
    list = list.slice().sort((a,b)=>{
      const av = a.price||0, bv = b.price||0;
      if(av===0 && bv===0) return 0;
      if(av===0) return 1;   // unknown price sinks to the bottom either way
      if(bv===0) return -1;
      return state.sort==='desc' ? bv-av : av-bv;
    });
  }
  return list;
}

function smapLabelTspans(name, seriesName, x){
  const short = name.replace(new RegExp('^'+seriesName+'\\s+','i'),'').toUpperCase();
  const words = short.split(' ');
  let lines;
  if(words.length<=1){ lines=[words[0]||'']; }
  else if(words.length===2){ lines=[words[0], words[1]]; }
  else { const mid=Math.ceil(words.length/2); lines=[words.slice(0,mid).join(' '), words.slice(mid).join(' ')]; }
  const startDy = -(lines.length-1)*3.8;
  return lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?startDy:7.6}">${l}</tspan>`).join('');
}
function smapLocalHalfWidth(y, cy, ry, rx){
  const topT=0.42, botT=0.30;
  const rel = (y-(cy-ry))/(2*ry);
  if(rel<topT){
    const t = Math.max(0,rel)/topT;
    return rx*Math.sin(t*Math.PI/2);
  }
  if(rel>1-botT){
    const t = Math.max(0,1-rel)/botT;
    return rx*Math.sin(t*Math.PI/2);
  }
  return rx;
}
function openSeriesMapSheet(seriesName){
  const info = SERIES_INFO[seriesName];
  if(!info) return;
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  const items = P.filter(p=>p.series===seriesName && p.mapPos);

  const cx=185, cy=217, rx=166, ry=187;
  const insetX=0.86, insetY=0.86;
  const toXY = (pos)=>{
    const yOff = (pos.y-0.5)*2*ry*insetY;
    const y = cy + yOff;
    const localRx = smapLocalHalfWidth(y, cy, ry, rx)*insetX;
    return {
      x: cx + (pos.x-0.5)*2*localRx,
      y,
    };
  };

  const isAdmin = new URLSearchParams(location.search).get('admin')==='1';

  const bubbles = items.map(p=>{
    const {x,y} = toXY(p.mapPos);
    const idx = P.indexOf(p);

      <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="6" font-weight="800" fill="#fff">${smapLabelTspans(p.name,seriesName,x)}</text>
    </g>`;
  }).join('');

  sheet.innerHTML = `
    <div class="smap-wrap">
      <div class="smap-head">

        <image href="images/badminton%20racquet_matrix.jpg" xlink:href="images/badminton%20racquet_matrix.jpg" x="0" y="0" width="369" height="500" preserveAspectRatio="xMidYMid meet"/>
        ${bubbles}
      </svg>
      ${isAdmin ? `
      <div class="smap-admin-bar">
        <div class="smap-admin-hint">🔧 관리자 모드 — 버블을 드래그해서 위치를 옮긴 뒤 아래 버튼으로 좌표를 복사하세요.</div>
        <button onclick="copySmapPositions('${seriesName}')">좌표 복사</button>
      </div>` : ''}
    </div>
  `;
  if(!overlay.classList.contains('open')){
    overlay.classList.add('open');
    history.pushState({sheetOpen:true}, '', location.href);
    sheetHistoryPushed = true;
  }
  if(isAdmin) initSeriesMapDrag(cx, cy, rx, ry, insetX, insetY);
}
function initSeriesMapDrag(cx, cy, rx, ry, insetX, insetY){
  const svg = document.getElementById('smapSvg');
  if(!svg) return;
  const toFrac = (x, y)=>{
    const fy = 0.5 + (y-cy)/(2*ry*insetY);
    const localRx = Math.max(6, smapLocalHalfWidth(y, cy, ry, rx)*insetX);
    const fx = 0.5 + (x-cx)/(2*localRx);
    return {x: Math.round(fx*100)/100, y: Math.round(fy*100)/100};
  };
  const svgPoint = (clientX, clientY)=>{
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    return ctm ? pt.matrixTransform(ctm.inverse()) : {x:0,y:0};
  };
  let dragging = null;
  svg.querySelectorAll('.smap-draggable').forEach(g=>{
    g.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragging = g;
      g.setPointerCapture(e.pointerId);
    });
  });
  svg.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const p = svgPoint(e.clientX, e.clientY);
    const idx = +dragging.dataset.idx;
    const frac = toFrac(p.x, p.y);
    P[idx].mapPos = frac;
    dragging.querySelector('circle').setAttribute('cx', p.x);
    dragging.querySelector('circle').setAttribute('cy', p.y);
    dragging.querySelectorAll('text tspan').forEach(t=> t.setAttribute('x', p.x));
    dragging.querySelector('text').setAttribute('y', p.y);
  });
  const stop = ()=>{ dragging = null; };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
}
function copySmapPositions(seriesName){

  const text = items.map(p=>`${p.name}: mapPos:{x:${p.mapPos.x},y:${p.mapPos.y}}`).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=> alert('좌표를 복사했어요. 챗에 붙여넣어 주세요.'),

function clamp01(x){ return Math.max(0, Math.min(1,x)); }
function productAxisScore(p){
  const axis = axisForProduct(p);
  if(!axis) return null;
  let power = axis.power, control = axis.control, speed = axis.speed;
  const flex = (p.specs && p.specs['탄성']) || 'MEDIUM';
  const flexBoost = {'HI-FLEX':-0.15,'MEDIUM':0,'STIFF':0.12,'EXTRA STIFF':0.22}[flex] || 0;
  power = clamp01(power + flexBoost*0.6);
  control = clamp01(control + flexBoost*0.3);
  speed = clamp01(speed - flexBoost*0.3);
  const weights = racquetWeights(p);
  const w0 = weights.length ? weights[0] : 83;
  const weightBoost = (w0-83)/20;
  power = clamp01(power + weightBoost*0.4);
  speed = clamp01(speed - weightBoost*0.4);
  return {power, control, speed};
}
const CMP_COLORS = ['#3fae2a','#2f6fed','#e8632a'];
function stringAxisScore(p){
  const perf = p.specs && p.specs['성능'];
  if(!perf) return null;
  const out = {};
  for(const m of perf.matchAll(/([가-힣]+)(\d+)/g)){
    out[m[1]] = clamp01(+m[2] / 11);
  }
  return out;
}
const STRING_TYPE_LABELS = {
  '반발력':'고반발력형', '내구성':'내구성형', '타구음':'타구음형',
  '충격흡수력':'충격흡수력형', '컨트롤':'컨트롤형',
};
function stringType(p){
  const scores = stringAxisScore(p);
  if(!scores) return null;
  let best = null, bestVal = -1;
  for(const [k,v] of Object.entries(scores)){
    if(v>bestVal){ bestVal=v; best=k; }
  }
  return best;
}
function stringPerfColor(p){
  const s = (p.series||'').toUpperCase();

function stringPerfInfographicHtml(p){

function buildFeelBox(products, scores, metrics){

const FINDER_STEPS = [
  {key:'level', q:'실력이 어느 정도이신가요?', opts:[

    {v:'안정성', label:'안정성', desc:'꾸준하고 안정적인 타구'},
  ]},
  {key:'weight', q:'선호하는 라켓 무게는요?', opts:[
    {v:'가벼운', label:'가벼운 라켓', desc:'빠른 스윙, 손목 부담 적음 (78g 이하)'},
    {v:'보통', label:'보통 무게', desc:'가장 대중적인 무게 (83g 전후)'},
    {v:'묵직한', label:'묵직한 라켓', desc:'스매시에 힘 실림 (88g 이상)'},
  ]},
];
let finderState = {step:0, level:null, style:null, want:null, weight:null};

const SERIES_AXIS = {
  ASTROX:{power:1,control:.35,speed:.35},
  ARCSABER:{power:.4,control:1,speed:.45},
  NANOFLARE:{power:.35,control:.45,speed:1},
};
const STYLE_AXIS = {
  '공격형':{power:1,control:.3,speed:.4},
  '수비형':{power:.3,control:.6,speed:.8},
  '올라운드':{power:.5,control:.9,speed:.5},
};
const WANT_AXIS = {
  '파워':{power:1,control:.2,speed:.3},
  '컨트롤':{power:.2,control:1,speed:.2},
  '스피드':{power:.3,control:.2,speed:1},
  '안정성':{power:.2,control:.8,speed:.3},
};
function axisForProduct(p){
  const n = (p.name||'').toUpperCase();
  if(n.includes('ASTROX')) return SERIES_AXIS.ASTROX;
  if(n.includes('ARCSABER')) return SERIES_AXIS.ARCSABER;
  if(n.includes('NANOFLARE')) return SERIES_AXIS.NANOFLARE;
  return null;
}
function racquetWeights(p){
  const s = (p.specs && p.specs['무게/그립']) || '';
  return [...s.matchAll(/\((\d+)g/g)].map(m=>+m[1]);
}
function weightBucket(g){
  if(g<=80) return '가벼운';
  if(g<=85) return '보통';
  return '묵직한';
}
function racquetLevel(p){
  const tags = p.tags || [];
  if(tags.includes('초급') || tags.includes('입문')) return '초급';
  if(tags.includes('중급')) return '중급';
  if(tags.includes('상급')) return '상급';
  const flex = (p.specs && p.specs['탄성']) || '';
  if(flex==='HI-FLEX') return '초급';
  if(flex==='MEDIUM') return '중급';
  if(flex==='STIFF' || flex==='EXTRA STIFF') return '상급';
  return '중급';
}
const LEVEL_ORDER = ['초급','중급','상급'];
function levelScore(p, wanted){
  const lv = racquetLevel(p);
  const diff = Math.abs(LEVEL_ORDER.indexOf(lv) - LEVEL_ORDER.indexOf(wanted));
  return diff===0 ? 1 : diff===1 ? 0.55 : 0.15;
}
const WEIGHT_ORDER = ['가벼운','보통','묵직한'];
function weightScoreOf(p, wanted){
  const weights = racquetWeights(p);
  if(!weights.length) return 0.5;
  const buckets = weights.map(weightBucket);
  if(buckets[0]===wanted) return 1;
  let best = 0;
  buckets.forEach(b=>{
    const diff = Math.abs(WEIGHT_ORDER.indexOf(b) - WEIGHT_ORDER.indexOf(wanted));
    const s = diff===0 ? 1 : diff===1 ? 0.5 : 0.1;
    if(s>best) best = s;
  });
  return best * 0.85;
}
function styleWantScore(p, style, want){
  const axis = axisForProduct(p);
  if(!axis) return 0;
  const sv = STYLE_AXIS[style], wv = WANT_AXIS[want];
  const uv = {
    power:   sv.power*0.4   + wv.power*0.6,
    control: sv.control*0.4 + wv.control*0.6,
    speed:   sv.speed*0.4   + wv.speed*0.6,
  };
  const dot = uv.power*axis.power + uv.control*axis.control + uv.speed*axis.speed;
  const magU = Math.sqrt(uv.power**2+uv.control**2+uv.speed**2);
  const magA = Math.sqrt(axis.power**2+axis.control**2+axis.speed**2);
  let score = dot/(magU*magA || 1);
  const tags = p.tags||[];
  if(tags.includes(style)) score += 0.06;
  if(tags.includes(want)) score += 0.06;
  return score;
}
function scoreRacquet(p, ans){
  const axis = axisForProduct(p);
  if(!axis) return -1;
  const sw = styleWantScore(p, ans.style, ans.want);
  const lv = levelScore(p, ans.level);
  const wt = weightScoreOf(p, ans.weight);
  return sw*0.4 + lv*0.2 + wt*0.4;
}
function computeFinderResults(){
  const candidates = P.filter(p=>p.c==='bad' && p.s==='racquet' && p.series!=='JUNIOR');
  return candidates
    .map(p=>({p, score:scoreRacquet(p, finderState)}))
    .filter(r=>r.score>=0)
    .sort((a,b)=>b.score-a.score);
}

  return '매칭도 낮음';
}

  sheet.innerHTML = `

      <div class="finder-q">${stepDef.q}</div>
      <div class="finder-opts">${opts}</div>
      ${finderState.step>0 ? `<div class="finder-nav"><button class="finder-btn prev" onclick="finderPrev()">이전</button></div>` : ''}
    </div>
  `;
}
let finderAdvanceTimer = null;
function pickFinderOption(key, value){
  finderState[key] = value;
  const stepDef = FINDER_STEPS[finderState.step];
  if(stepDef.key !== key) { renderFinderStep(); return; }
  document.querySelectorAll('.finder-opt').forEach(opt=>{
    opt.classList.toggle('picked', opt.dataset.value === value);
  });
  clearTimeout(finderAdvanceTimer);
  finderAdvanceTimer = setTimeout(finderNext, 380);
}
function finderPrev(){
  clearTimeout(finderAdvanceTimer);
  if(finderState.step>0){ finderState.step--; renderFinderStep(); }
}
function finderNext(){
  const stepDef = FINDER_STEPS[finderState.step];
  if(!finderState[stepDef.key]) return;
  if(finderState.step < FINDER_STEPS.length-1){
    finderState.step++;
    renderFinderStep();
  } else {
    renderFinderResults();
  }
}
function renderFinderResults(){
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  const allResults = computeFinderResults();
  const top3 = allResults.slice(0,3);
  const rest = allResults.slice(3);
  const maxScore = allResults.length ? allResults[0].score : 1;
  const cardHtml = (r,i)=>{
    const p = r.p;
    const pct = Math.max(1, Math.round((r.score/maxScore)*100));
    return `
    <div class="finder-result-card" onclick="finderShowDetail(${P.indexOf(p)})">
      <div class="fr-rank${i<3?' top':''}">${i+1}</div>
      <div class="fr-thumb" style="background:${p.grad}">${thumbContent(p)}</div>
      <div class="fr-body">
        <div class="fr-name">${p.name}</div>
        <div class="fr-match">${matchTierLabel(pct)}</div>
        <div class="fr-price">${fmtPrice(p.price)}</div>
      </div>
    </div>`;
  };
  const cards = top3.map(cardHtml).join('');
  const restCards = rest.map((r,i)=>cardHtml(r,i+3)).join('');
  sheet.innerHTML = `
    <button class="x floating" onclick="closeSheet()">✕</button>
    <button class="prev floating" onclick="finderResultsBack()">← 이전</button>
    <div class="finder-wrap finder-results">
      <h2>당신에게 맞는 라켓 TOP ${top3.length}</h2>
      <p class="fr-sub">${finderState.level} · ${finderState.style} · ${finderState.want} 선호 · ${finderState.weight} 라켓 기준 추천</p>
      ${cards || '<p style="color:var(--muted);font-size:13px;">조건에 맞는 라켓을 찾지 못했어요.</p>'}
      ${restCards ? `<div class="fr-section-divider"></div>${restCards}` : ''}
      <button class="finder-restart" onclick="openFinderSheet()">다시 진단하기</button>
    </div>
  `;
}
function finderResultsBack(){
  finderState.step = FINDER_STEPS.length - 1;
  renderFinderStep();
}
function finderShowDetail(idx){
  const p = P[idx];
  setHeroGallery(p);
  const perfHtml = stringPerfInfographicHtml(p);
  const rows = Object.entries(p.specs).filter(([k])=> !(perfHtml && k==='성능')).map(([k,v])=>`<tr><td>${specLabelHtml(k)}</td><td>${(p.c==='acc'||k==='색상') ? String(v) : annotateTech(String(v))}</td></tr>`).join('');
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  sheet.innerHTML = `
    <button class="x floating" onclick="closeSheet()">✕</button>
    <button class="back floating" onclick="renderFinderResults()">← 진단 결과</button>
    <div class="sheet-hero" style="background:${p.grad};overflow:hidden;">${sheetHeroContent(p)}</div>
    ${galleryStripHtml(p)}
    <div class="sheet-body">
      <h2>${p.name}</h2>
      <div class="kr-full">${p.kr}</div>
      <div class="price-full">${fmtPrice(p.price)}</div>
      <div class="desc">${p.desc}</div>
      ${perfHtml}
      <table class="specs">${rows}</table>
      <div class="tags">${(p.tags||[]).map(t=>`<span>#${t}</span>`).join('')}</div>
      ${buyButtonHtml(p)}
    </div>
  `;
  if(perfHtml){
    setTimeout(()=>{
      sheet.querySelectorAll('.perf-bar-fill').forEach(el=>{ el.style.width = el.dataset.pct+'%'; });
    }, 300);
  }
}
function openAnyFinderSheet(){
  if(state.sub === 'string') openStringFinderSheet();
  else openFinderSheet();
}

/* =============== STRING FINDER =============== */
const STRING_FINDER_STEPS = [
  {key:'primary', q:'스트링에서 가장 중요하게 생각하는 특성은?', opts:[
    {v:'반발력', label:'반발력', desc:'강력한 스매시와 빠른 셔틀 스피드'},
    {v:'컨트롤', label:'컨트롤', desc:'정교한 셔틀콕 컨트롤'},
    {v:'내구성', label:'내구성', desc:'끊어짐 없이 오래 쓰는 스트링'},
    {v:'충격흡수력', label:'충격흡수력', desc:'팔꿈치·손목 부담을 줄여주는 타구감'},
    {v:'타구음', label:'타구음', desc:'경쾌하고 강렬한 타구음'},
  ]},
  {key:'secondary', q:'그 다음으로 중요한 특성은?', opts:[]},
  {key:'gauge', q:'선호하는 스트링 굵기는요?', opts:[
    {v:'얇은', label:'얇은 스트링', desc:'예민한 타구감, 스핀에 유리 (0.63mm 이하)'},
    {v:'보통', label:'보통 굵기', desc:'가장 대중적인 선택 (0.64~0.68mm)'},
    {v:'두꺼운', label:'두꺼운 스트링', desc:'튼튼하고 오래 쓰기 좋음 (0.69mm 이상)'},
  ]},
];
let stringFinderState = {step:0, primary:null, secondary:null, gauge:null};
function stringGaugeMm(p){
  const g = (p.specs && p.specs['굵기']) || '';
  const m = g.match(/(\d+\.\d+)mm/);
  return m ? parseFloat(m[1]) : null;
}
function stringGaugeBucket(mm){
  if(mm==null) return null;
  if(mm<=0.63) return '얇은';
  if(mm<=0.68) return '보통';
  return '두꺼운';
}
function scoreString(p, ans){
  const metrics = stringAxisScore(p);
  if(!metrics) return -1;
  const primaryScore = metrics[ans.primary] || 0;
  const secondaryScore = metrics[ans.secondary] || 0;
  const bucket = stringGaugeBucket(stringGaugeMm(p));
  const gaugeScore = bucket===ans.gauge ? 1 : (bucket ? 0.4 : 0.5);
  return primaryScore*0.55 + secondaryScore*0.25 + gaugeScore*0.2;
}
function computeStringFinderResults(){
  const candidates = P.filter(p=>p.c==='bad' && p.s==='string' && stringAxisScore(p));
  return candidates
    .map(p=>({p, score:scoreString(p, stringFinderState)}))
    .filter(r=>r.score>=0)
    .sort((a,b)=>b.score-a.score);
}
function recoButtonHtml(p){
  if(!p.reco) return '';
  const idx = P.indexOf(p);
  return `<button class="reco-trigger" onclick="showRecoPopover(event,${idx})">🧵 추천 스트링</button>`;
}
function showRecoPopover(evt, idx){
  evt.stopPropagation();
  const p = P[idx];
  const pop = document.getElementById('recoPopover');
  const groups = Object.entries(p.reco).map(([label, names])=>{
    const items = names.map(name=>{
      const sp = P.find(x=>x.c==='bad' && x.s==='string' && x.name===name);
      if(!sp) return '';
      const spIdx = P.indexOf(sp);
      return `<div class="rp-item" onclick="closeRecoPopover();openSheet(P[${spIdx}])">
        <div class="rp-thumb" style="background:${sp.grad}">${thumbContent(sp)}</div>
        <div class="rp-name">${name}</div>
      </div>`;
    }).join('');
    return `<div class="rp-group"><div class="rp-group-label">${label}</div>${items}</div>`;
  }).join('');
  document.getElementById('recoPopoverBody').innerHTML = groups;

  const rect = evt.target.getBoundingClientRect();
  const sheetRect = document.getElementById('sheet').getBoundingClientRect();
  const popW = 236;
  pop.style.visibility = 'hidden';
  pop.style.display = 'block';
  const popH = pop.offsetHeight;
  pop.style.visibility = '';
  const rightSpace = window.innerWidth - sheetRect.right;
  let left, top;
  if(rightSpace >= popW + 28){
    left = sheetRect.right + 16;
    top = sheetRect.bottom - popH;
    top = Math.max(16, Math.min(top, window.innerHeight - popH - 16));
  } else {
    left = Math.max(10, Math.min(rect.left, window.innerWidth - popW - 10));
    top = rect.bottom + 8;
    if(top + popH > window.innerHeight - 10) top = Math.max(10, rect.top - popH - 8);
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.display = 'block';
}
function closeRecoPopover(){
  document.getElementById('recoPopover').style.display = 'none';
}
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('recoPopover');
  if(pop.style.display === 'block' && !pop.contains(e.target) && !e.target.classList.contains('reco-trigger')){
    closeRecoPopover();
  }
});
function showCmpAddPopover(evt){
  evt.stopPropagation();
  const pop = document.getElementById('cmpAddPopover');
  document.getElementById('cmpAddSearch').value = '';
  renderCmpAddList('');
  const rect = evt.target.getBoundingClientRect();
  const popW = 260;
  pop.style.visibility = 'hidden';
  pop.style.display = 'block';
  const popH = pop.offsetHeight;
  pop.style.visibility = '';
  let left = Math.max(10, Math.min(rect.left, window.innerWidth - popW - 10));
  let top = rect.bottom + 8;
  if(top + popH > window.innerHeight - 10) top = Math.max(10, rect.top - popH - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.display = 'block';
  document.getElementById('cmpAddSearch').focus();
}
function closeCmpAddPopover(){
  document.getElementById('cmpAddPopover').style.display = 'none';
}
function renderCmpAddList(q){
  const list = document.getElementById('cmpAddList');
  if(!state.compare.length){ list.innerHTML = ''; return; }
  const gk = groupKey(P[state.compare[0]]);
  const query = q.trim().toLowerCase();
  const candidates = P.filter((p,idx)=> groupKey(p)===gk && !state.compare.includes(idx) &&
    (!query || p.name.toLowerCase().includes(query) || (p.kr||'').toLowerCase().includes(query)));
  if(!candidates.length){ list.innerHTML = '<div class="cmp-add-empty">검색 결과가 없어요</div>'; return; }
  list.innerHTML = candidates.map(p=>{
    const idx = P.indexOf(p);
    return `<div class="cmp-add-item" onclick="addToCompareFromPopover(${idx})">
      <div class="cmp-add-thumb" style="background:${p.grad}">${thumbContent(p)}</div>
      <div class="cmp-add-name">${p.name}</div>
    </div>`;
  }).join('');
}
function filterCmpAddList(){
  renderCmpAddList(document.getElementById('cmpAddSearch').value);
}
function addToCompareFromPopover(idx){
  if(state.compare.length>=3) return;
  state.compare.push(idx);
  syncCardCompareUI();
  syncCompareBar();
  closeCmpAddPopover();
  openCompareSheet();
}
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('cmpAddPopover');
  if(pop.style.display === 'block' && !pop.contains(e.target) && !e.target.classList.contains('cmp-add-btn')){
    closeCmpAddPopover();
  }
});
function openStringFinderSheet(){
  clearTimeout(stringFinderAdvanceTimer);
  stringFinderState = {step:0, primary:null, secondary:null, gauge:null};
  const overlay = document.getElementById('overlay');
  renderStringFinderStep();
  overlay.classList.add('open');
  history.pushState({sheetOpen:true}, '', location.href);
  sheetHistoryPushed = true;
}
function renderStringFinderStep(){
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  const stepDef = STRING_FINDER_STEPS[stringFinderState.step];
  let opts = stepDef.opts;
  if(stepDef.key === 'secondary'){
    opts = STRING_FINDER_STEPS[0].opts.filter(o=>o.v !== stringFinderState.primary);
  }
  const picked = stringFinderState[stepDef.key];
  const progress = STRING_FINDER_STEPS.map((s,i)=>`<i class="${i<=stringFinderState.step?'done':''}"></i>`).join('');
  const optsHtml = opts.map(o=>`
    <div class="finder-opt${picked===o.v?' picked':''}" data-value="${o.v}" onclick="pickStringFinderOption('${stepDef.key}','${o.v}')">
      <div>
        <div>${o.label}</div>
        <div class="fo-desc">${o.desc}</div>
      </div>
      <span class="fo-check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
    </div>`).join('');
  sheet.innerHTML = `
    <button class="x floating" onclick="closeSheet()">✕</button>
    <div class="finder-wrap">
      <div class="finder-progress">${progress}</div>
      <div class="finder-step-label">STEP ${stringFinderState.step+1} / ${STRING_FINDER_STEPS.length}</div>
      <div class="finder-q">${stepDef.q}</div>
      <div class="finder-opts">${optsHtml}</div>
      ${stringFinderState.step>0 ? `<div class="finder-nav"><button class="finder-btn prev" onclick="stringFinderPrev()">이전</button></div>` : ''}
    </div>
  `;
}
let stringFinderAdvanceTimer = null;
function pickStringFinderOption(key, value){
  stringFinderState[key] = value;
  const stepDef = STRING_FINDER_STEPS[stringFinderState.step];
  if(stepDef.key !== key){ renderStringFinderStep(); return; }
  document.querySelectorAll('.finder-opt').forEach(opt=>{
    opt.classList.toggle('picked', opt.dataset.value === value);
  });
  clearTimeout(stringFinderAdvanceTimer);
  stringFinderAdvanceTimer = setTimeout(stringFinderNext, 380);
}
function stringFinderPrev(){
  clearTimeout(stringFinderAdvanceTimer);
  if(stringFinderState.step>0){ stringFinderState.step--; renderStringFinderStep(); }
}
function stringFinderNext(){
  const stepDef = STRING_FINDER_STEPS[stringFinderState.step];
  if(!stringFinderState[stepDef.key]) return;
  if(stringFinderState.step < STRING_FINDER_STEPS.length-1){
    stringFinderState.step++;
    renderStringFinderStep();
  } else {
    renderStringFinderResults();
  }
}
function renderStringFinderResults(){
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  const allResults = computeStringFinderResults();
  const top3 = allResults.slice(0,3);
  const rest = allResults.slice(3);
  const maxScore = allResults.length ? allResults[0].score : 1;
  const cardHtml = (r,i)=>{
    const p = r.p;
    const pct = Math.max(1, Math.round((r.score/maxScore)*100));
    return `
    <div class="finder-result-card" onclick="stringFinderShowDetail(${P.indexOf(p)})">
      <div class="fr-rank${i<3?' top':''}">${i+1}</div>
      <div class="fr-thumb" style="background:${p.grad}">${thumbContent(p)}</div>
      <div class="fr-body">
        <div class="fr-name">${p.name}</div>
        <div class="fr-match">${matchTierLabel(pct)}</div>
        <div class="fr-price">${fmtPrice(p.price)}</div>
      </div>
    </div>`;
  };
  const cards = top3.map(cardHtml).join('');
  const restCards = rest.map((r,i)=>cardHtml(r,i+3)).join('');
  sheet.innerHTML = `
    <button class="x floating" onclick="closeSheet()">✕</button>
    <button class="prev floating" onclick="stringFinderResultsBack()">← 이전</button>
    <div class="finder-wrap finder-results">
      <h2>당신에게 맞는 스트링 TOP ${top3.length}</h2>
      <p class="fr-sub">${stringFinderState.primary} 우선 · ${stringFinderState.secondary} 다음 · ${stringFinderState.gauge} 굵기 기준 추천</p>
      ${cards || '<p style="color:var(--muted);font-size:13px;">조건에 맞는 스트링을 찾지 못했어요.</p>'}
      ${restCards ? `<div class="fr-section-divider"></div>${restCards}` : ''}
      <button class="finder-restart" onclick="openStringFinderSheet()">다시 진단하기</button>
    </div>
  `;
}
function stringFinderResultsBack(){
  stringFinderState.step = STRING_FINDER_STEPS.length - 1;
  renderStringFinderStep();
}
function stringFinderShowDetail(idx){
  const p = P[idx];
  setHeroGallery(p);
  const perfHtml = stringPerfInfographicHtml(p);
  const rows = Object.entries(p.specs).filter(([k])=> !(perfHtml && k==='성능')).map(([k,v])=>`<tr><td>${specLabelHtml(k)}</td><td>${(p.c==='acc'||k==='색상') ? String(v) : annotateTech(String(v))}</td></tr>`).join('');
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  sheet.innerHTML = `
    <button class="x floating" onclick="closeSheet()">✕</button>
    <button class="back floating" onclick="renderStringFinderResults()">← 진단 결과</button>
    <div class="sheet-hero" style="background:${p.grad};overflow:hidden;">${sheetHeroContent(p)}</div>
    ${galleryStripHtml(p)}
    <div class="sheet-body">
      <h2>${p.name}</h2>
      <div class="kr-full">${p.kr}</div>
      <div class="price-full">${fmtPrice(p.price)}</div>
      <div class="desc">${p.desc}</div>
      ${perfHtml}
      <table class="specs">${rows}</table>
      <div class="tags">${(p.tags||[]).map(t=>`<span>#${t}</span>`).join('')}</div>
      ${buyButtonHtml(p)}
    </div>
  `;
  if(perfHtml){
    setTimeout(()=>{
      sheet.querySelectorAll('.perf-bar-fill').forEach(el=>{ el.style.width = el.dataset.pct+'%'; });
    }, 300);
  }
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});
window.addEventListener('popstate', ()=>{
  if(document.getElementById('overlay').classList.contains('open')) closeSheet(true);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('overlay').classList.contains('open')) closeSheet();
});

document.getElementById('searchInput').addEventListener('input', e=>{
  state.q = e.target.value.trim();
  renderFilterModeTabs();
  renderSeriesRow();
  renderGrid();
});
