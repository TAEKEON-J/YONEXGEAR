function galleryList(p){
  if(Array.isArray(p.images) && p.images.length) return p.images;
  const arr = [];
  if(p.imgDetail) arr.push(p.imgDetail);
  if(p.img && p.img!==p.imgDetail) arr.push(p.img);
  return arr;
}
function galleryStripHtml(p){
  const imgs = galleryList(p);
  const recoHtml = recoButtonHtml(p);
  if(imgs.length<2 && !recoHtml) return '';
  const thumbs = imgs.length<2 ? '' : imgs.map((src,i)=>`<img src="${src}" onclick="setHeroImage('${src}',this,${i})"
      style="width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none;cursor:pointer;
      border:2px solid ${i===0?'var(--navy)':'transparent'};" class="gallery-thumb">`).join('');
  return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 0;">
    <div id="galleryThumbWrap" style="display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;">${thumbs}</div>
    ${recoHtml}
  </div>`;
}
function colorSwatchStyle(c){
  if(typeof c==='object' && c.hex){
    const hexes = Array.isArray(c.hex) ? c.hex : [c.hex];
    if(hexes.length>=2) return `background:linear-gradient(135deg, ${hexes[0]} 50%, ${hexes[1]} 50%);`;
    return `background:${hexes[0]};`;
  }
  const name = typeof c==='object' ? c.name : c;
  const parts = name.split('/').map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2){
    const c1 = colorToHex(parts[0]), c2 = colorToHex(parts[1]);
    return `background:linear-gradient(135deg, ${c1} 50%, ${c2} 50%);`;
  }
  return `background:${colorToHex(parts[0]||name)};`;
}
function productColorList(p){
  if(p.colors && p.colors.length) return p.colors;
  const groups = extractColorGroups(p.specs && p.specs['색상']);
  return groups.map(t=>t.replace(/\s*\([^)]*\)\s*$/,'').trim()).filter(Boolean);
}
function colorTagsHtml(p){
  const colors = productColorList(p);
  if(colors.length<2) return '';
  const idx = P.indexOf(p);
  let activeIdx = colors.findIndex(c=>{
    const label = typeof c==='object' ? c.name : c;
    return p.colorImages && p.colorImages[label] && p.colorImages[label].length;
  });
  if(activeIdx<0) activeIdx = 0;
  return `<div class="price-color-swatches">${colors.map((c,i)=>{
    const label = typeof c==='object' ? c.name : c;
    return `<button type="button" class="color-swatch${i===activeIdx?' active':''}" style="${colorSwatchStyle(c)}" title="${label}" aria-label="${label}" aria-pressed="${i===activeIdx}" onclick="selectProductColor(${idx},'${label.replace(/'/g,"\\'")}',this)"></button>`;
  }).join('')}</div>`;
}

    const heroWrap = hero.closest('.sheet-hero');

  const thumbWrap = document.getElementById('galleryThumbWrap');

let cmpLimitTimeout;

function maybeShowCmpCoach(){

function clamp01(x){ return Math.max(0, Math.min(1,x)); }
function productAxisScore(p){
  const axis = axisForProduct(p);
  if(!axis) return null;
  let power = axis.power, control = axis.control, speed = axis.speed;
  const flex = (p.specs && p.specs['탄성']) || 'MEDIUM';
  const flexBoost = {'HI-FLEX':-0.15,'MEDIUM':0,'STIFF':0.12,'EXTRA STIFF':0.22}[flex] || 0;
  power = clamp01(power + flexBoost*0.6);
  control = clamp01(control + flexBoost*0.3);
  speed = clamp01(speed - flexBoost*0.3);
  const weights = racquetWeights(p);
  const w0 = weights.length ? weights[0] : 83;
  const weightBoost = (w0-83)/20;
  power = clamp01(power + weightBoost*0.4);
  speed = clamp01(speed - weightBoost*0.4);
  return {power, control, speed};
}
const CMP_COLORS = ['#3fae2a','#2f6fed','#e8632a'];
function stringAxisScore(p){
  const perf = p.specs && p.specs['성능'];
  if(!perf) return null;
  const out = {};
  for(const m of perf.matchAll(/([가-힣]+)(\d+)/g)){
    out[m[1]] = clamp01(+m[2] / 11);
  }
  return out;
}
const STRING_TYPE_LABELS = {

const TENSTRING_SERIES_COLORS = {'POLYTOUR':'#0066B3', 'REXIS':'#00A84F'};
function stringPerfColor(p){
  if(p.c==='ten') return TENSTRING_SERIES_COLORS[p.series] || CMP_COLORS[0];
  return STRING_CATEGORY_COLORS[p.stringCategory] || CMP_COLORS[0];

function stringPerfInfographicHtml(p){
  if(p.s!=='string' || (p.c!=='bad' && p.c!=='ten')) return '';
  const perf = p.specs && p.specs['성능'];
  if(!perf) return '';
  const color = stringPerfColor(p);
  const maxScale = p.c==='ten' ? 10 : 11;
  const metrics = p.c==='ten'
    ? [['파워','파워'],['스핀','스핀'],['편안함','편안함'],['컨트롤','컨트롤'],['내구성','내구성']]
    : [['반발력','반발력'],['내구성','내구성'],['타구음','타구음'],['충격흡수력','충격흡수력'],['컨트롤','컨트롤']];
  const rows = metrics.map(([key,label],i)=>{
    const m = perf.match(new RegExp(key+'(\\d+)'));
    if(!m) return '';
    const val = +m[1];
    const pct = Math.round(clamp01(val/maxScale)*100);
    return `<div class="perf-row"><div class="perf-label">${label}</div><div class="perf-bar-track"><div class="perf-bar-fill" data-pct="${pct}" style="background:${color};transition-delay:${i*70}ms"></div></div><div class="perf-val">${val}</div></div>`;
  }).join('');
  if(!rows) return '';
  return `<div class="perf-card"><div class="perf-title">성능</div>${rows}</div>`;
}
function buildFeelBox(products, scores, metrics){
  const headCols = metrics.map(([key,label])=>`<div class="feel-head">${label}</div>`).join('');
  const rows = products.map((p,i)=>{
    const nameCell = `<div class="feel-name"><span class="feel-dot" style="background:${CMP_COLORS[i]}"></span>${p.name}</div>`;
    const cells = metrics.map(([key])=>{
      const pct = Math.round((scores[i][key]||0)*100);
      return `<div class="feel-cell"><div class="feel-bar-track"><div class="feel-bar-fill" data-pct="${pct}" style="background:${CMP_COLORS[i]}"></div></div></div>`;
    }).join('');
    return nameCell + cells;
  }).join('');
  const nameW = metrics.length <= 3 ? 110 : 76;
  return `<div class="feel-box">
    <div class="feel-box-title">체감 비교</div>
    <div class="feel-grid" style="grid-template-columns:${nameW}px repeat(${metrics.length},1fr);">
      <div class="feel-head"></div>${headCols}
      ${rows}
    </div>
  </div>`;
}
function feelCompareRows(products){
  const key = groupKey(products[0]);
  if(key === 'bad_racquet'){
    const scores = products.map(productAxisScore);
    if(scores.some(s=>!s)) return '';
    return buildFeelBox(products, scores, [['power','POWER'],['control','CONTROL'],['speed','SPEED']]);
  }
  if(key === 'bad_string'){
    const scores = products.map(stringAxisScore);
    if(scores.some(s=>!s)) return '';
    return buildFeelBox(products, scores, [
      ['반발력','반발력'],['내구성','내구성'],['타구음','타구음'],
      ['충격흡수력','충격흡수력'],['컨트롤','컨트롤'],
    ]);
  }
  return '';
}

const SERIES_AXIS = {
  ASTROX:{power:1,control:.35,speed:.35},
  ARCSABER:{power:.4,control:1,speed:.45},
  NANOFLARE:{power:.35,control:.45,speed:1},
};
const STYLE_AXIS = {
  '공격형':{power:1,control:.3,speed:.4},
  '수비형':{power:.3,control:.6,speed:.8},
  '올라운드':{power:.5,control:.9,speed:.5},
};
const WANT_AXIS = {
  '파워':{power:1,control:.2,speed:.3},
  '컨트롤':{power:.2,control:1,speed:.2},
  '스피드':{power:.3,control:.2,speed:1},
  '안정성':{power:.2,control:.8,speed:.3},

function axisForProduct(p){
  const n = (p.name||'').toUpperCase();
  if(n.includes('ASTROX')) return SERIES_AXIS.ASTROX;
  if(n.includes('ARCSABER')) return SERIES_AXIS.ARCSABER;
  if(n.includes('NANOFLARE')) return SERIES_AXIS.NANOFLARE;
  return null;
}
function racquetWeights(p){
  const s = (p.specs && p.specs['무게/그립']) || '';
  return [...s.matchAll(/\((\d+)g/g)].map(m=>+m[1]);
}
function weightBucket(g){
  if(g<=80) return '가벼운';
  if(g<=85) return '보통';
  return '묵직한';
}
function racquetLevel(p){
  const tags = p.tags || [];
  if(tags.includes('초급') || tags.includes('입문')) return '초급';
  if(tags.includes('중급')) return '중급';
  if(tags.includes('상급')) return '상급';
  const flex = (p.specs && p.specs['탄성']) || '';
  if(flex==='HI-FLEX') return '초급';
  if(flex==='MEDIUM') return '중급';
  if(flex==='STIFF' || flex==='EXTRA STIFF') return '상급';
  return '중급';
}
const LEVEL_ORDER = ['초급','중급','상급'];
function levelScore(p, wanted){
  const lv = racquetLevel(p);
  const diff = Math.abs(LEVEL_ORDER.indexOf(lv) - LEVEL_ORDER.indexOf(wanted));
  return diff===0 ? 1 : diff===1 ? 0.55 : 0.15;
}
const WEIGHT_ORDER = ['가벼운','보통','묵직한'];
function weightScoreOf(p, wanted){
  const weights = racquetWeights(p);
  if(!weights.length) return 0.5;
  const buckets = weights.map(weightBucket);
  if(buckets[0]===wanted) return 1;
  let best = 0;
  buckets.forEach(b=>{
    const diff = Math.abs(WEIGHT_ORDER.indexOf(b) - WEIGHT_ORDER.indexOf(wanted));
    const s = diff===0 ? 1 : diff===1 ? 0.5 : 0.1;
    if(s>best) best = s;
  });
  return best * 0.85;
}
function styleWantScore(p, style, want){
  const axis = axisForProduct(p);
  if(!axis) return 0;
  const sv = STYLE_AXIS[style], wv = WANT_AXIS[want];
  const uv = {
    power:   sv.power*0.4   + wv.power*0.6,
    control: sv.control*0.4 + wv.control*0.6,
    speed:   sv.speed*0.4   + wv.speed*0.6,
  };
  const dot = uv.power*axis.power + uv.control*axis.control + uv.speed*axis.speed;
  const magU = Math.sqrt(uv.power**2+uv.control**2+uv.speed**2);
  const magA = Math.sqrt(axis.power**2+axis.control**2+axis.speed**2);
  let score = dot/(magU*magA || 1);
  const tags = p.tags||[];
  if(tags.includes(style)) score += 0.06;
  if(tags.includes(want)) score += 0.06;
  return score;
}
function scoreRacquet(p, ans){
  const axis = axisForProduct(p);
  if(!axis) return -1;
  const sw = styleWantScore(p, ans.style, ans.want);
  const lv = levelScore(p, ans.level);
  const wt = weightScoreOf(p, ans.weight);
  return sw*0.4 + lv*0.2 + wt*0.4;
}
function computeFinderResults(){
  const candidates = P.filter(p=>p.c==='bad' && p.s==='racquet' && p.series!=='JUNIOR');
  return candidates
    .map(p=>({p, score:scoreRacquet(p, finderState)}))
    .filter(r=>r.score>=0)
    .sort((a,b)=>b.score-a.score);
}

}

    {v:'반발력', label:'반발력', desc:'강력한 스매시와 빠른 셔틀 스피드'},
    {v:'컨트롤', label:'컨트롤', desc:'정교한 셔틀콕 컨트롤'},
    {v:'내구성', label:'내구성', desc:'끊어짐 없이 오래 쓰는 스트링'},
    {v:'충격흡수력', label:'충격흡수력', desc:'팔꿈치·손목 부담을 줄여주는 타구감'},

  ]},
  {key:'secondary', q:'그 다음으로 중요한 특성은?', opts:[]},
  {key:'gauge', q:'선호하는 스트링 굵기는요?', opts:[
    {v:'얇은', label:'얇은 스트링', desc:'예민한 타구감, 스핀에 유리 (0.63mm 이하)'},
    {v:'보통', label:'보통 굵기', desc:'가장 대중적인 선택 (0.64~0.68mm)'},
    {v:'두꺼운', label:'두꺼운 스트링', desc:'튼튼하고 오래 쓰기 좋음 (0.69mm 이상)'},
  ]},

let stringFinderState = {step:0, primary:null, secondary:null, gauge:null};
function stringGaugeMm(p){
  const g = (p.specs && p.specs['굵기']) || '';
  const m = g.match(/(\d+\.\d+)mm/);
  return m ? parseFloat(m[1]) : null;
}
function stringGaugeBucket(mm){
  if(mm==null) return null;
  if(mm<=0.63) return '얇은';
  if(mm<=0.68) return '보통';
  return '두꺼운';
}
function scoreString(p, ans){
  const metrics = stringAxisScore(p);
  if(!metrics) return -1;
  const primaryScore = metrics[ans.primary] || 0;
  const secondaryScore = metrics[ans.secondary] || 0;
  const bucket = stringGaugeBucket(stringGaugeMm(p));
  const gaugeScore = bucket===ans.gauge ? 1 : (bucket ? 0.4 : 0.5);
  return primaryScore*0.55 + secondaryScore*0.25 + gaugeScore*0.2;
}
function computeStringFinderResults(){
  const candidates = P.filter(p=>p.c==='bad' && p.s==='string' && stringAxisScore(p));
  return candidates
    .map(p=>({p, score:scoreString(p, stringFinderState)}))
    .filter(r=>r.score>=0)
    .sort((a,b)=>b.score-a.score);
}

  pop.style.visibility = 'hidden';
  pop.style.display = 'block';
  const popH = pop.offsetHeight;
  pop.style.visibility = '';
  const rightSpace = window.innerWidth - sheetRect.right;
  let left, top, origin;
  if(rightSpace >= popW + 28){
    left = sheetRect.right + 16;
    top = sheetRect.bottom - popH;
    top = Math.max(16, Math.min(top, window.innerHeight - popH - 16));
    origin = 'left center';
  } else {
    left = Math.max(10, Math.min(rect.left, window.innerWidth - popW - 10));
    top = rect.bottom + 8;
    origin = 'top center';
    if(top + popH > window.innerHeight - 10){ top = Math.max(10, rect.top - popH - 8); origin = 'bottom center'; }
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.transformOrigin = origin;
  pop.style.display = 'block';
  pop.classList.add('pop-open');
}

    <div class="sheet-body">
      <h2>${p.name}</h2>
      <div class="kr-full">${p.kr}</div>
      <div class="price-row"><div class="price-full">${fmtPrice(p)}</div>${colorTagsHtml(p)}</div>
      <div class="desc">${p.desc}</div>
      ${perfHtml}
      <table class="specs">${rows}</table>
      <div class="tags">${(p.tags||[]).map(t=>`<span>#${t}</span>`).join('')}</div>
      ${buyButtonHtml(p)}
    </div>
  `;
  if(perfHtml){
    setTimeout(()=>{
      sheet.querySelectorAll('.perf-bar-fill').forEach(el=>{ el.style.transform = 'scaleX(' + (el.dataset.pct/100) + ')'; });
    }, 300);
  }
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});
window.addEventListener('popstate', ()=>{
  if(document.getElementById('overlay').classList.contains('open')) closeSheet(true);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('overlay').classList.contains('open')) closeSheet();
});

document.getElementById('searchInput').addEventListener('input', e=>{
  state.q = e.target.value.trim();
  renderFilterModeTabs();
  renderSeriesRow();
  renderGrid();
});

/* =============== SCROLL TO TOP =============== */
const toTopBtn = document.getElementById('toTop');
function syncToTopBtn(){
  if(document.body.classList.contains('hero-active')){ toTopBtn.classList.remove('show'); return; }
  toTopBtn.classList.toggle('show', window.scrollY > 220);
}
window.addEventListener('scroll', syncToTopBtn, {passive:true});
document.getElementById('sortSelect').addEventListener('change', e=>{
  state.sort = e.target.value;
  renderGrid();
});
const newOnlyBtn = document.getElementById('newOnlyBtn');
newOnlyBtn.addEventListener('click', ()=>{
  state.newOnly = !state.newOnly;
  newOnlyBtn.style.background = state.newOnly ? 'var(--navy)' : '#fff';
  newOnlyBtn.style.color = state.newOnly ? '#fff' : 'var(--muted)';
  newOnlyBtn.style.borderColor = state.newOnly ? 'var(--navy)' : 'var(--line)';
  renderGrid();
});

renderAll();

/* Admin-only bulk register button: hidden by default, only shows with ?admin=1
   in the URL, so links shared with customers/reps stay clean. */
if(new URLSearchParams(location.search).get('admin')==='1'){
  document.getElementById('adminBtn').style.display='block';
}
</script>
</body>
</html>
