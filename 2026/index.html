<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YONEX 2026 카탈로그</title>
<meta name="description" content="요넥스 2026 배드민턴·테니스 용품 디지털 카탈로그 — 라켓, 신발, 스트링, 셔틀콕 전체 상품을 한눈에 검색하고 비교하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="YONEX 2026 GEAR CATALOGUE">
<meta property="og:description" content="요넥스 2026 배드민턴·테니스 용품 디지털 카탈로그">
<meta property="og:image" content="images/header-banner.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='69' font-family='Arial,sans-serif' font-weight='900' font-size='58' fill='%238cff5c' text-anchor='middle'>Y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#111111;
    --navy-deep:#000000;
    --blue:#1656c9;
    --green:#8cff5c;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-hover:cubic-bezier(.2,.8,.2,1);
    --ease-icon:cubic-bezier(.2,0,0,1);
    --ease-slide:cubic-bezier(.65,0,.35,1);
    --red:#e01130;
    --ink:#0a0a0a;
    --paper:#f5f5f7;
    --card:#ffffff;
    --line:#e6e6e6;
    --muted:#6f6f6f;
    --radius:8px;
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);overflow-x:hidden;}
  a{color:inherit;}
  img{max-width:100%;}

  /* ---------- HERO / LANDING ---------- */
  body.hero-active{overflow:hidden;}
  .hero{
    position:fixed;inset:0;z-index:300;overflow-y:auto;isolation:isolate;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
    text-align:left;color:#fff;padding:40px 26px 56px;
    background:linear-gradient(180deg,#000000,#141414);
    transition:transform .55s var(--ease-slide), opacity .45s ease;
  }
  .hero.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
  .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
  .hero-photo-overlay{
    position:absolute;inset:0;z-index:-2;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.88) 100%);
  }
  .hero-badge-row{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;}
  .hero-logo{font-weight:900;font-size:16px;letter-spacing:.2px;}
  .hero-yr{font-size:16px;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.2px;}
  .hero-title{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1.05;margin:4px 0 18px;max-width:320px;letter-spacing:-.02em;}
  .hero-sub{font-size:14px;color:#e4e4e6;max-width:280px;line-height:1.6;margin-bottom:3px;}
  .hero-stats{font-size:12px;color:#c2c2c6;margin-bottom:26px;}
  .hero-cta{
    background:#fff;color:var(--navy-deep);font-weight:800;font-size:15px;
    padding:14px 32px;border-radius:999px;border:none;cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:22px;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .hero-cta:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(0,0,0,.32);}
  .hero-cta:active{transform:translateY(0) scale(.96);}
  .hero-cats{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;justify-content:flex-start;max-width:300px;}
  .hero-cats button{
    background:none;border:none;color:rgba(255,255,255,.82);
    padding:0;font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    cursor:pointer;display:inline-flex;align-items:center;transition:color .15s ease;
  }
  .hero-cats button:not(:first-child)::before{content:'·';margin:0 10px;color:rgba(255,255,255,.35);font-weight:400;}
  .hero-cats button:hover{color:#fff;}
  @media print{ .hero{display:none !important;} }

  @keyframes heroTextIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .hero-badge-row{animation:heroTextIn .85s var(--ease) both;}
  .hero-title{animation:heroTextIn .85s var(--ease) .12s both;}
  .hero-sub{animation:heroTextIn .85s var(--ease) .3s both;}
  .hero-stats{animation:heroTextIn .85s var(--ease) .38s both;}

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky;top:0;z-index:50;overflow:hidden;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    color:#1d1d1f;
    padding:24px 16px 0;
    border-bottom:1px solid #d2d2d7;
  }
  header.top .brandrow, header.top .searchwrap, header.top nav.cats, header.top nav.subcats{
    position:relative;z-index:2;
  }
  .brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between;}
  .brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto;}
  .brand .logo{font-weight:900;font-size:27px;letter-spacing:-.02em;color:#1d1d1f;}
  .brand .yr{
    font-size:11px;background:transparent;color:#6e6e73;font-weight:700;
    padding:0;letter-spacing:.02em;line-height:1;opacity:.8;
    border:none;
    display:inline-flex;align-items:center;
  }
  .header-logo{flex:0 0 auto;display:flex;align-items:center;}
  .header-logo img{height:20px;width:auto;display:block;}
  @media(max-width:400px){.header-logo img{height:16px;}}
  .searchwrap{margin:18px 0 16px;}
  .searchbox{
    display:flex;align-items:center;gap:8px;
    background:#f5f5f7;border:1px solid transparent;
    border-radius:980px;padding:7px 14px;
  }
  .searchbox:focus-within{outline:2px solid var(--green);outline-offset:2px;}
  .searchbox input{
    background:transparent;border:none;outline:none;color:#1d1d1f;
    font-size:16px;width:111.12%;transform:scale(.9);transform-origin:left center;
  }
  .searchbox input::placeholder{color:#86868b;}
  .searchbox svg{flex:none;opacity:.7;color:#6e6e73;width:14px;height:14px;}

  .to-top{
    position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;
    width:46px;height:46px;border-radius:50%;
    background:#000;border:1px solid rgba(255,255,255,.18);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(0,0,0,.4);cursor:pointer;
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .to-top.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .to-top:hover{background:#1a1a1a;}
  .to-top:active{background:#000;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  @media print{ .to-top{display:none !important;} }

  .compare-bar{
    position:fixed;left:16px;right:74px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:59;
    background:#000;border:1px solid rgba(255,255,255,.18);border-radius:999px;
    padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .compare-bar.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .compare-bar .cb-label{color:#fff;font-size:12px;font-weight:700;white-space:nowrap;transition:color .15s ease;}
  .compare-bar .cb-cta{
    background:#fff;color:#1d1d1f;font-weight:800;font-size:12px;
    border:none;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;
    transition:opacity .15s ease,transform .1s ease;
  }
  .compare-bar .cb-cta:active{transform:scale(.96);}
  .compare-bar .cb-cta:disabled{opacity:.35;cursor:default;}
  .compare-bar .cb-clear{
    background:transparent;border:none;color:#8a8a8a;font-size:15px;line-height:1;cursor:pointer;
    padding:6px 8px;flex:none;
  }
  .compare-bar .cb-clear:hover{color:#fff;}
  @media print{ .compare-bar{display:none !important;} }

  nav.cats{
    display:flex;gap:10px;overflow-x:auto;padding:0 0 10px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats button{
    flex:none;white-space:nowrap;
    background:transparent;color:#3d3d40;border:1.5px solid #d2d2d7;
    padding:8px 17px;border-radius:980px;font-size:13px;font-weight:800;cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease,transform .1s ease;
  }
  nav.cats button:hover{color:#1d1d1f;border-color:#adadb2;}
  nav.cats button:active{transform:scale(.96);}
  nav.cats button.active{
    background:#1d1d1f;color:#fff;border-color:#1d1d1f;
  }
  nav.cats button.active:hover{background:#1d1d1f;color:#fff;}

  nav.subcats{
    display:flex;gap:30px;overflow-x:auto;padding:0 0 16px;margin-top:0;
    scrollbar-width:none;
  }
  nav.subcats::-webkit-scrollbar{display:none;}
  nav.subcats button{
    flex:none;white-space:nowrap;background:transparent;color:#86868b;
    border:none;padding:7px 2px;font-size:13.5px;font-weight:700;cursor:pointer;
    border-bottom:3px solid transparent;transition:color .15s ease,border-bottom-color .15s ease;
  }
  nav.subcats button:hover{color:#1d1d1f;}
  nav.subcats button.active{color:#1d1d1f;border-bottom-color:#34c759;}
  nav.subcats button.active:hover{color:#1d1d1f;}

  nav.cats.has-more, nav.subcats.has-more, .serieswrap.has-more, .cmp-table-wrap.has-more, .filter-mode-tabs.has-more{
    -webkit-mask-image:linear-gradient(to right, black calc(100% - 28px), transparent);
    mask-image:linear-gradient(to right, black calc(100% - 28px), transparent);
  }

  /* ---------- SERIES CHIPS ---------- */
  .filter-mode-tabs{padding:12px 16px 0;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;}
  .filter-mode-tabs::-webkit-scrollbar{display:none;}
  .filter-mode-tabs:empty{padding:0;}
  .filter-mode-tabs button{
    background:none;border:none;padding:2px 0 6px;font-size:12.5px;font-weight:700;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;transition:color .15s ease,border-bottom-color .15s ease;
  }
  .filter-mode-tabs button:hover{color:var(--ink);}
  .filter-mode-tabs button.active{color:var(--ink);border-bottom-color:var(--navy);}
  .filter-mode-tabs button.mode-reset-all{color:var(--blue);margin-left:auto;}
  .filter-mode-tabs button.mode-reset-all:hover{color:var(--blue);opacity:.75;}
  .serieswrap{padding:12px 16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .serieswrap::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
    background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;
    transition:border-color .15s ease,color .15s ease;
  }
  .chip:hover{border-color:var(--muted);color:var(--ink);}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .chip.active:hover{border-color:var(--navy);color:#fff;}

  :focus-visible{outline:2px solid var(--green);outline-offset:2px;}
  #origPdfBtn, #shareBtn{transition:opacity .15s ease,transform .1s ease;}
  #origPdfBtn:hover, #shareBtn:hover{opacity:.85;}
  #origPdfBtn:active, #shareBtn:active{transform:scale(.96);}

  main{padding:14px 16px 60px;max-width:1100px;margin:0 auto;}

  /* ---------- SERIES INFO (header + map entry) ---------- */
  .series-hero{
    border-radius:16px;padding:18px 20px 18px;color:#fff;margin:14px 0 12px;
    position:relative;overflow:hidden;
  }
  .series-hero .sh-kicker{font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;color:#fff;}
  .series-hero .sh-title{font-size:clamp(18px,6.1vw,24px);font-weight:900;line-height:1.05;margin:6px 0 8px;letter-spacing:-.03em;white-space:nowrap;}
  .series-hero .sh-desc{font-size:13px;line-height:1.5;max-width:340px;margin-bottom:14px;}
  .series-hero .sh-cta{
    display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1d1d1f;font-weight:800;font-size:12px;
    border:none;border-radius:999px;padding:8px 15px;cursor:pointer;transition:opacity .15s ease,transform .1s ease;
  }
  .series-hero .sh-cta:hover{opacity:.92;}
  .series-hero .sh-cta:active{transform:scale(.96);}

  /* ---------- SHOE SERIES HERO (신발 시리즈 헤더) ---------- */
  .ssh{
    width:100%;border:none;text-align:left;font:inherit;color:inherit;cursor:pointer;
    -webkit-appearance:none;appearance:none;position:relative;overflow:hidden;
    border-radius:16px;margin:14px 0 12px;min-height:182px;
    background-size:cover;background-position:center;background-color:#f4f1ee;
    display:flex;flex-direction:column;justify-content:center;
    transition:transform .1s ease;
  }
  .ssh:active{transform:scale(.98);}
  .ssh.ssh-static{cursor:default;}
  .ssh.ssh-static:active{transform:none;}
  .ssh::before{
    content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(100deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.4) 38%, rgba(255,255,255,.08) 58%, rgba(255,255,255,0) 72%);
  }
  .ssh-body{position:relative;z-index:1;padding:18px 20px;max-width:62%;}
  .ssh-title{font-size:clamp(18px,6.1vw,24px);font-weight:900;line-height:1.05;letter-spacing:-.03em;margin:0 0 8px;color:var(--ink);}
  .ssh-desc{font-size:13px;line-height:1.5;color:var(--muted);font-weight:600;word-break:keep-all;}
  .ssh-cta{
    position:absolute;right:20px;bottom:16px;z-index:1;
    display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--ink);font-weight:800;font-size:12px;
    border-radius:999px;padding:8px 15px;border:1.5px solid rgba(10,10,10,.7);
    transition:opacity .15s ease;
  }
  @media (hover:hover) and (pointer:fine){ .ssh:hover .ssh-cta{opacity:.85;} }

  /* shoe tech sheet — KEY TECHNOLOGY cards */
  .ssh-tech-detail-list{display:flex;flex-direction:column;gap:16px;}
  .ssh-tech-detail{
    background:var(--paper);border-radius:18px;padding:16px;border:1px solid rgba(10,10,10,.06);
  }
  .ssh-tech-detail-img{
    width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#fff;
    outline:1px solid rgba(10,10,10,.08);outline-offset:-1px;
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .ssh-tech-detail-img img{width:100%;height:100%;object-fit:contain;}
  .ssh-tech-detail-img.ssh-tech-img-pending{
    background:repeating-linear-gradient(135deg,#fff,#fff 10px,#ececee 10px,#ececee 20px);
  }
  .ssh-tech-detail-img.ssh-tech-img-pending img{display:none;}
  .ssh-tech-detail-img.ssh-tech-img-pending::after{content:'이미지 준비중';font-size:11px;font-weight:700;color:var(--muted);}
  .ssh-tech-name{font-size:13px;font-weight:900;letter-spacing:.01em;color:var(--ink);}
  .ssh-tech-kr{font-size:10.5px;font-weight:700;color:var(--muted);margin:3px 0 8px;}
  .ssh-tech-desc{font-size:12px;line-height:1.55;color:var(--ink);font-weight:500;}

  .smap-wrap{padding:0 0 26px;}
  .smap-head{
    display:flex;align-items:center;gap:10px;padding:16px 16px 4px;position:sticky;top:0;background:#fff;z-index:2;
  }
  .smap-head button{
    flex:none;width:34px;height:34px;border-radius:50%;border:none;background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  }
  .smap-head h2{flex:1;text-align:center;font-size:14px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--ink);}
  .smap-svg{display:block;width:100%;height:auto;padding:8px 4px 4px;box-sizing:border-box;}
  .smap-svg .smap-bubble{cursor:pointer;}
  .smap-svg .smap-bubble circle{transition:r .15s ease;}
  .smap-svg .smap-bubble:hover circle{r:16;}
  .smap-svg .smap-bubble:focus-visible{outline:none;}
  .smap-svg .smap-bubble:focus-visible circle{r:16;stroke:var(--green);stroke-width:3;}
  .smap-svg .smap-bubble-lg:hover circle{r:21;}
  .smap-svg .smap-bubble-lg:focus-visible circle{r:21;stroke:var(--green);stroke-width:3;}
  .rg-tennis-map-svg text{pointer-events:none;}
  .rg-tennis-map-svg .st16, .rg-tennis-map-svg .st13{pointer-events:none;}
  .smap-svg .smap-draggable{cursor:grab;touch-action:none;}
  .smap-svg .smap-draggable:active{cursor:grabbing;}
  .smap-svg .smap-draggable circle{stroke-width:2.5;}
  .smap-svg text{font-family:'Archivo',-apple-system,BlinkMacSystemFont,sans-serif;user-select:none;}
  .smap-admin-bar{
    display:flex;align-items:center;gap:10px;margin:0 16px 16px;padding:12px 14px;
    background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;
  }
  .smap-admin-hint{flex:1;font-size:11.5px;line-height:1.5;color:#9a3412;}
  .smap-admin-bar button{
    flex:none;background:#1d1d1f;color:#fff;font-weight:800;font-size:12.5px;
    border:none;border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;
  }

  .section-title{
    font-size:13px;font-weight:900;color:var(--ink);text-transform:uppercase;
    letter-spacing:.08em;margin:34px 0 16px;display:none;align-items:center;gap:8px;
  }
  .section-title .bar{display:none;}
  .count{color:var(--muted);font-size:12px;text-align:right;margin:6px 0 0;}

  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:13px;
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--card);border:none;border-radius:14px;
    padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05);
    transition:transform .18s var(--ease-hover), box-shadow .18s ease;
  }
  .card.card-enter{animation:cardIn .4s var(--ease) both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card:active{transform:translateY(0) scale(.96);}
  @media (hover:hover) and (pointer:fine) {
    .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 16px 32px rgba(0,0,0,.1);}
  }
  .card .thumb{
    aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;position:relative;overflow:hidden;
  }
  .card .thumb .thumb-icon-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;width:100%;height:100%;padding:8px;
  }
  .card .thumb svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .card .thumb .thumb-label{font-size:11px;font-weight:800;letter-spacing:.03em;opacity:.9;}
  .sheet-hero svg{width:76px;height:76px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));}
  .badge-new{
    display:inline-flex;white-space:nowrap;flex:none;
    background:#fff;color:#7c3aed;border:1.2px solid #7c3aed;
    border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:-.01em;
    padding:2.4px 7.5px;
  }
  .badge-new.design{color:var(--blue);border-color:var(--blue);}
  .card-top{position:relative;}
  .card.cmp-selected{box-shadow:0 0 0 2px #1d1d1f,0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.05);}
  .cmp-toggle{
    position:absolute;top:-10px;right:-10px;z-index:2;
    width:26px;height:26px;border-radius:50%;
    background:#fff;border:1.5px solid rgba(0,0,0,.12);color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    transition:background .15s ease,border-color .15s ease,transform .1s ease,opacity .15s ease;
  }
  .cmp-toggle:hover{background:#fff;}
  .cmp-toggle:active{transform:scale(.96);}
  .cmp-toggle.active{background:#1d1d1f;border-color:#1d1d1f;color:#fff;}
  .cmp-toggle.muted{opacity:.3;}
  .cmp-icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:.55;transform:scale(1);filter:blur(0);
    transition:opacity .2s var(--ease-icon),transform .2s var(--ease-icon),filter .2s var(--ease-icon);
  }
  .cmp-icon-check{opacity:0;transform:scale(.25);filter:blur(4px);}
  .cmp-toggle.active .cmp-icon-plus{opacity:0;transform:scale(.25);filter:blur(4px);}
  .cmp-toggle.active .cmp-icon-check{opacity:1;transform:scale(1);filter:blur(0);}
  .cmp-coach{
    display:none;position:absolute;z-index:65;max-width:200px;
    align-items:center;gap:6px;background:var(--ink);color:#fff;
    padding:9px 10px 9px 12px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.3);
    font-size:11.5px;font-weight:700;line-height:1.4;
    animation:cmpCoachIn .25s ease-out;
    opacity:1;transform:translateY(0);
    transition:opacity .18s ease,transform .18s ease;
  }
  .cmp-coach.leaving{opacity:0;transform:translateY(-4px);}
  @keyframes cmpCoachIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .cmp-coach-arrow{
    position:absolute;bottom:-6px;width:12px;height:12px;background:var(--ink);
    transform:rotate(45deg);border-radius:2px;
  }
  .cmp-coach-close{
    flex:none;background:none;border:none;color:rgba(255,255,255,.6);font-size:11px;
    cursor:pointer;padding:2px;line-height:1;
  }
  .cmp-coach-close:hover{color:#fff;}
  .card .series-tag{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;}
  .card .name{font-size:14px;font-weight:900;line-height:1.25;color:var(--ink);text-transform:uppercase;letter-spacing:-.01em;margin-top:2px;}
  .card .kr{font-size:11.5px;color:var(--muted);margin-top:-4px;}
  .card .price{margin-top:auto;padding-top:4px;font-size:15px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .card .price small{font-weight:600;color:var(--muted);font-size:11px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
  }

  /* ---------- SERIES DIVIDER ---------- */
  .series-divider{
    grid-column:1 / -1;position:relative;overflow:hidden;
    aspect-ratio:3/1;min-height:240px;max-height:480px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;text-align:center;
    width:100vw;margin:56px calc(50% - 50vw) 56px;
  }
  .series-divider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .series-divider .sd-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.32),rgba(0,0,0,.1));}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,15,35,.55);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .55s var(--ease),visibility 0s linear .55s;
  }
  .overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s var(--ease);}
  @media(min-width:720px){.overlay{align-items:center;}}
  .sheet{
    background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;
    max-height:88vh;overflow-y:auto;padding:0 0 24px;position:relative;
    animation:up .45s var(--ease);
  }
  @media(min-width:720px){.sheet{border-radius:20px;max-height:80vh;}}
  @media(min-width:720px){.sheet.cmp-mode{max-width:900px;}}
  @keyframes up{from{transform:translateY(16px) scale(.99);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .finder-wrap,.cmp-wrap{animation:panelIn .35s var(--ease);}
  .sheet-reveal-2{animation:panelIn .5s var(--ease) .1s both;}
  @keyframes panelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .sheet-head{display:none;}
  .x.floating{
    position:absolute;top:14px;right:14px;z-index:5;
    border:none;background:rgba(255,255,255,.9);color:var(--ink);width:34px;height:34px;border-radius:50%;
    font-size:16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  .prev.floating{
    position:absolute;top:14px;right:56px;z-index:5;
    border:none;background:rgba(255,255,255,.9);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  .sheet-hero{
    width:100%;aspect-ratio:1/1;border-radius:20px 20px 0 0;
    display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;
    outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px;
  }
  @media(min-width:720px){.sheet-hero{border-radius:20px 20px 0 0;}}
  .sheet-body{padding:18px 18px 16px;}
  .sheet-body h2{font-size:19px;margin:0 0 2px;color:var(--ink);text-transform:uppercase;}
  .sheet-body .kr-full{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .price-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px;}
  .sheet-body .price-full{font-size:18px;font-weight:800;color:var(--navy-deep);margin:0;}
  .sheet-body .desc{font-size:13.5px;line-height:1.6;color:#333;background:var(--paper);padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  .price-color-swatches{display:flex;gap:8px;flex:none;}
  .color-swatch{
    width:22px;height:22px;border-radius:50%;flex:none;padding:0;box-sizing:border-box;
    border:1.5px solid rgba(10,10,10,.14);cursor:pointer;
    transition:transform .1s ease,box-shadow .15s ease;
  }
  .color-swatch:hover{transform:scale(1.1);}
  .color-swatch.active{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--navy);}
  table.specs{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;}
  table.specs tr{border-bottom:1px solid var(--line);}
  table.specs td{padding:8px 4px;vertical-align:top;word-break:break-word;overflow-wrap:anywhere;}
  table.specs td:first-child{color:var(--muted);width:34%;font-weight:600;}
  table.specs td:last-child{font-weight:600;color:var(--ink);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .tags span{font-size:11px;background:#eaf1ff;color:var(--blue);padding:4px 9px;border-radius:8px;font-weight:700;}

  /* ---------- COMPARE TABLE ---------- */
  .cmp-wrap{padding:20px 18px 24px;}
  .cmp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;padding-right:40px;}
  .cmp-header h2{font-size:18px;font-weight:900;margin:0;color:var(--ink);text-transform:uppercase;}
  .cmp-header-actions{display:flex;align-items:center;gap:14px;flex:none;}
  .cmp-clear-all{font-size:12px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px;}
  .cmp-add-btn{
    font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;
    background:#f4f5f3;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;
    transition:border-color .15s ease;
  }
  .cmp-add-btn:hover{border-color:var(--muted);}
  .cmp-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;overflow-anchor:none;}
  table.cmp-table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;}
  @media(min-width:480px){ table.cmp-table{min-width:460px;} }
  table.cmp-table th,table.cmp-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px;text-align:left;}
  table.cmp-table:not(.cmp-table-head) th:first-child,table.cmp-table:not(.cmp-table-head) td:first-child{
    position:sticky;left:0;background:#fff;font-weight:700;color:var(--muted);white-space:nowrap;z-index:1;padding-right:10px;width:76px;
    box-shadow:6px 0 8px -6px rgba(0,0,0,.12);
  }
  @media(min-width:480px){ table.cmp-table:not(.cmp-table-head) th:first-child,table.cmp-table:not(.cmp-table-head) td:first-child{padding-right:14px;width:96px;} }
  .cmp-col-head{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:164px;margin:0 auto;}
  .cmp-col-head .cmp-thumb{width:100%;max-width:120px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px;}
  .cmp-col-head .cmp-thumb img{width:100%;height:100%;object-fit:cover;}
  .cmp-col-head .cmp-thumb svg{width:56px;height:56px;}
  .cmp-col-head .cmp-thumb .thumb-icon-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;padding:8px;}
  .cmp-col-head .cmp-thumb .thumb-label{font-size:14px;font-weight:800;letter-spacing:.02em;opacity:.9;}
  .cmp-col-head .cmp-name{font-size:11px;font-weight:800;text-align:center;line-height:1.3;text-transform:uppercase;color:var(--ink);}
  .cmp-col-head .cmp-price{font-size:12px;font-weight:900;color:var(--ink);}
  .cmp-col-head .cmp-remove{font-size:10px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;}
  .cmp-col-head .cmp-remove:hover{border-color:var(--muted);color:var(--ink);}
  table.cmp-table td{color:var(--ink);font-weight:600;word-break:break-word;}

  /* ---------- FEEL COMPARE (TRANSPOSED BOX) ---------- */
  .cmp-table thead th{border-bottom:none;}
  .feel-box{background:#f4f5f3;border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;margin:0 auto 18px;max-width:480px;}
  .feel-box-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;text-align:center;}
  .feel-grid{display:grid;row-gap:12px;column-gap:6px;align-items:center;}
  .feel-grid .feel-head{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;text-align:center;}
  .feel-grid .feel-name{font-size:11px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .feel-grid .feel-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .feel-cell .feel-bar-track{width:100%;height:6px;border-radius:999px;background:#e0e1de;overflow:hidden;}
  .feel-cell .feel-bar-fill{height:100%;width:100%;border-radius:999px;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease);}

  /* ---------- STRING PERFORMANCE INFOGRAPHIC (DETAIL SHEET) ---------- */
  .perf-card{background:#f4f5f3;border-radius:14px;padding:14px 16px 12px;margin-bottom:14px;}
  .perf-card .perf-title{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .perf-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .perf-row:last-child{margin-bottom:0;}
  .perf-label{width:68px;flex:none;font-size:12px;font-weight:800;color:var(--ink);}
  .perf-bar-track{flex:1;height:7px;border-radius:999px;background:#e0e1de;overflow:hidden;}
  .perf-bar-fill{height:100%;width:100%;border-radius:999px;background:#3fae2a;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease);}
  .perf-val{width:20px;flex:none;text-align:right;font-size:12px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;}

  /* ---------- RECOMMENDED STRINGS (RACQUET DETAIL) ---------- */
  .reco-trigger{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink);
    background:#f4f5f3;border:1px solid var(--line);border-radius:999px;padding:7px 13px;
    cursor:pointer;flex:none;white-space:nowrap;margin:0;transition:background .15s ease,border-color .15s ease;
  }
  .reco-trigger:hover{border-color:var(--muted);}
  #recoPopover{
    position:fixed;z-index:200;width:236px;background:#fff;color:var(--ink);
    padding:18px;border-radius:16px;font-size:13px;line-height:1.5;
    box-shadow:0 20px 48px rgba(0,0,0,.16),0 2px 10px rgba(0,0,0,.06);
    border:1px solid var(--line);display:none;
    opacity:0;transform:scale(.96);
    transition:opacity .16s var(--ease-icon),transform .16s var(--ease-icon);
  }
  #recoPopover.pop-open{opacity:1;transform:scale(1);}
  #recoPopover .rp-close{position:absolute;top:12px;right:14px;color:var(--muted);font-size:13px;cursor:pointer;}
  #recoPopover .rp-title{
    font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
    margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  #recoPopover .rp-group + .rp-group{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  #recoPopover .rp-group-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  #recoPopover .rp-item{display:flex;align-items:center;gap:11px;cursor:pointer;padding:2px 0;transition:opacity .12s ease;}
  #recoPopover .rp-item:hover{opacity:.7;}
  #recoPopover .rp-item + .rp-item{margin-top:9px;}
  #recoPopover .rp-thumb{
    width:46px;height:46px;flex:none;border-radius:10px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:#fff;
    outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px;
  }
  #recoPopover .rp-thumb img{width:100%;height:100%;object-fit:cover;}
  #recoPopover .rp-thumb svg{width:18px;height:18px;}
  #recoPopover .rp-thumb .thumb-icon-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;height:100%;padding:3px;}
  #recoPopover .rp-thumb .thumb-label{font-size:5.5px;font-weight:800;letter-spacing:.02em;opacity:.9;}
  #recoPopover .rp-name{font-size:12.5px;font-weight:800;color:var(--ink);}

  #cmpAddPopover{
    position:fixed;z-index:200;width:260px;background:#fff;color:var(--ink);
    padding:14px;border-radius:16px;font-size:13px;
    box-shadow:0 20px 48px rgba(0,0,0,.16),0 2px 10px rgba(0,0,0,.06);
    border:1px solid var(--line);display:none;
    opacity:0;transform:scale(.96);
    transition:opacity .16s var(--ease-icon),transform .16s var(--ease-icon);
  }
  #cmpAddPopover.pop-open{opacity:1;transform:scale(1);}
  .cmp-add-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .cmp-add-header input{
    flex:1;min-width:0;font-size:13px;font-family:inherit;padding:8px 10px;border-radius:8px;
    border:1px solid var(--line);outline:none;
  }
  .cmp-add-header input:focus{border-color:var(--ink);}
  #cmpAddPopover .rp-close{position:static;flex:none;}
  .cmp-add-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}

  .cmp-add-item:hover{background:#f4f5f3;}
  .cmp-add-thumb{
    width:38px;height:38px;flex:none;border-radius:8px;overflow:hidden;

  }
  .cmp-add-thumb img{width:100%;height:100%;object-fit:cover;}
  .cmp-add-thumb svg{width:16px;height:16px;}
  .cmp-add-thumb .thumb-icon-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;height:100%;padding:2px;}
  .cmp-add-thumb .thumb-label{font-size:4.5px;font-weight:800;letter-spacing:.02em;opacity:.9;}
  .cmp-add-name{font-size:12.5px;font-weight:700;color:var(--ink);}
  .cmp-add-empty{padding:14px 4px;color:var(--muted);font-size:12.5px;text-align:center;}

  /* ---------- RACQUET FINDER ---------- */
  .finder-promo-wrap{margin:0;}
  .finder-promo{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:#1d1d1f;border-radius:0;width:100%;
    padding:16px;color:#f5f5f7;

  .finder-promo .fp-eyebrow{font-size:10.5px;font-weight:800;color:#34c759;letter-spacing:.06em;text-transform:uppercase;}
  .finder-promo .fp-title{font-size:14px;font-weight:800;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .finder-promo .fp-title b{color:#34c759;}

    flex:none;display:flex;align-items:center;justify-content:center;

  .finder-promo .fp-cta:active{transform:scale(.96);}

  /* ---------- RACQUET GUIDE sheet ---------- */
  .rg-sheet{position:relative;}
  .rg-hero{
    position:relative;overflow:hidden;border-radius:20px 20px 0 0;
    background:linear-gradient(150deg,#dce8f0,#f4f7f8 68%);
    background-size:cover;background-position:center;
    padding:24px 22px 26px;min-height:300px;
    display:flex;flex-direction:column;justify-content:flex-end;
  }

    content:'';position:absolute;inset:0;z-index:0;pointer-events:none;

  .rg-sheet-head{padding:24px 44px 4px 20px;}

  .rg-sheet-head-title{font-size:19px;font-weight:900;letter-spacing:-.01em;color:var(--ink);margin:0;}

  .rg-hero-eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .rg-hero-title{font-size:clamp(38px,15vw,52px);font-weight:900;line-height:.95;letter-spacing:-.03em;color:var(--ink);margin:0 0 12px;text-transform:lowercase;}

  .rg-section{padding:36px 20px 0;}
  .rg-section-head{display:flex;align-items:flex-start;gap:8px;}
  .rg-section-kicker{font-size:11px;font-weight:900;color:var(--green-dk,#4a8f2c);letter-spacing:.05em;margin-top:3px;}
  .rg-section-head-text{flex:1;min-width:0;}
  .rg-section-head h3{font-size:15.5px;font-weight:900;letter-spacing:-.01em;color:var(--ink);margin:0;}
  .rg-section-head-text h3:last-child{margin-bottom:14px;}
  .rg-section-lead{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 14px;}

  /* RACQUET SELECTOR — venn diagram (designer-supplied SVG artwork) */
  .rg-venn{position:relative;width:100%;aspect-ratio:390/250;margin:6px 0 4px;filter:drop-shadow(0 10px 18px rgba(20,20,20,.12));}
  .rg-venn-svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .rg-venn-axis{position:absolute;top:2%;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);}
  .rg-venn-axis-power{left:23.4%;transform:translateX(-50%);}
  .rg-venn-axis-speed{left:76.6%;transform:translateX(-50%);}
  .rg-venn-label{
    position:absolute;top:56%;left:50%;transform:translate(-50%,-50%);
    border:none;background:none;color:transparent;
    cursor:pointer;padding:10px 14px;line-height:1.2;transition:transform .1s ease;
  }
  .rg-venn-label:active{transform:translate(-50%,-50%) scale(.94);}
  .rg-venn-label-left{left:23.4%;}
  .rg-venn-label-mid{left:50%;}
  .rg-venn-label-right{left:76.6%;}

  .rg-selector-legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;}
  .rg-legend-col{border:none;background:none;padding:10px 4px;text-align:center;cursor:pointer;border-top:3px solid var(--line);transition:transform .1s ease;}
  .rg-legend-col:active{transform:scale(.96);}
  .rg-legend-col-astrox{border-top-color:#e8622c;}
  .rg-legend-col-arcsaber{border-top-color:#d43a4a;}
  .rg-legend-col-nanoflare{border-top-color:#37c8b0;}
  .rg-legend-name{font-size:11.5px;font-weight:900;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px;font-style:italic;}
  .rg-legend-balance{font-size:8.5px;line-height:1.5;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:8px;text-transform:uppercase;}
  .rg-legend-balance span{display:block;white-space:nowrap;}
  .rg-legend-trait{font-size:10px;line-height:1.4;color:var(--ink);font-weight:600;word-break:keep-all;min-height:42px;display:flex;align-items:flex-start;justify-content:center;}

  /* RACQUET TECHNOLOGY — ISOMETRIC diagram (designer artwork) */
  .rg-iso-card{display:block;width:100%;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
  .rg-iso-svg{display:block;width:100%;height:auto;}
  .rg-iso-text{padding:0 20px 22px;}
  .rg-iso-text-tt{padding-top:18px;}
  .rg-iso-full{font-size:12px;line-height:1.65;color:var(--ink);font-weight:600;text-align:left;margin:0 0 18px;}
  .rg-iso-divider-line{border-top:1px solid var(--line);margin:0 0 14px;}
  .rg-iso-footnote-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .rg-iso-footnote-row span{font-size:9px;line-height:1.5;color:var(--muted);font-weight:600;text-align:left;}
  .rg-iso-footnote-row span:last-child{flex:none;text-align:right;}
  .rg-iso-footnote-sub{font-size:9px;line-height:1.5;color:var(--muted);font-weight:600;text-align:left;}

  /* RACQUET TECHNOLOGY (tennis) — text-only tech cards */
  .rg-tech-card{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:20px;}
  .rg-tech-lead{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 12px;}
  .rg-tech-body{font-size:12px;line-height:1.65;color:var(--ink);font-weight:600;margin:0;}
  .rg-tech-foot{font-size:9px;line-height:1.5;color:var(--muted);font-weight:600;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}

  .rg-cta-wrap{padding:24px 20px 4px;}
  .rg-cta{
    display:block;width:100%;border:none;border-radius:999px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:800;
    padding:15px;cursor:pointer;text-align:center;
    transition:opacity .15s ease,transform .1s ease;
  }
  .rg-cta:active{transform:scale(.98);}
  @media (hover:hover) and (pointer:fine){ .rg-cta:hover{opacity:.9;} }

  .back.floating{
    position:absolute;top:14px;left:14px;z-index:5;
    border:none;background:rgba(255,255,255,.9);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);
  }

  .finder-wrap{padding:22px 20px 26px;}
  .finder-progress{display:flex;gap:6px;margin-bottom:18px;}
  .finder-progress i{flex:1;height:3px;border-radius:3px;background:var(--line);}
  .finder-progress i.done{background:var(--ink);}
  .finder-step-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .finder-q{font-size:19px;font-weight:900;color:var(--ink);margin:0 0 18px;line-height:1.4;}
  .finder-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .finder-opt{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;
    background:#fff;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink);
    transition:border-color .15s ease,background .15s ease;
  }
  .finder-opt:hover{border-color:#c4c4c4;}
  .finder-opt.picked{border-color:var(--ink);background:#f5f5f5;}
  .finder-opt .fo-desc{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px;}
  .finder-opt .fo-check{
    flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;
    transition:background .15s ease,border-color .15s ease;
  }
  .finder-opt.picked .fo-check{background:var(--ink);border-color:var(--ink);}
  .fo-check svg{
    opacity:0;transform:scale(.25);filter:blur(4px);
    transition:opacity .2s var(--ease-icon),transform .2s var(--ease-icon),filter .2s var(--ease-icon);
  }
  .finder-opt.picked .fo-check svg{opacity:1;transform:scale(1);filter:blur(0);}
  .finder-nav{display:flex;gap:10px;}
  .finder-btn{flex:1;padding:13px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;border:none;transition:transform .1s ease;}
  .finder-btn:active{transform:scale(.96);}
  .finder-btn.prev{background:#f0f0f0;color:var(--ink);}

  .finder-results h2{font-size:18px;font-weight:900;margin:0 0 4px;color:var(--ink);text-transform:uppercase;}
  .finder-results .fr-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .finder-result-card{
    display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;
    transition:border-color .15s ease,transform .1s ease;
  }
  .finder-result-card:hover{border-color:var(--ink);}
  .finder-result-card:active{transform:scale(.98);}
  .finder-result-card .fr-rank{
    flex:none;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);
    border:1.5px solid var(--ink);box-sizing:border-box;
    font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .finder-result-card .fr-rank.top{background:var(--ink);color:#fff;border-color:var(--ink);}
  .finder-result-card .fr-thumb{
    flex:none;width:56px;height:56px;border-radius:9px;overflow:hidden;display:flex;
    align-items:center;justify-content:center;color:#fff;
    outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px;
  }
  .finder-result-card .fr-thumb img{width:100%;height:100%;object-fit:cover;}
  .finder-result-card .fr-thumb svg{width:24px;height:24px;}
  .finder-result-card .fr-thumb .thumb-icon-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;padding:4px;}
  .finder-result-card .fr-thumb .thumb-label{font-size:6.5px;font-weight:800;letter-spacing:.02em;opacity:.9;}
  .finder-result-card .fr-body{flex:1;min-width:0;}
  .finder-result-card .fr-name{font-size:13.5px;font-weight:800;color:var(--ink);text-transform:uppercase;}
  .finder-result-card .fr-match{font-size:11px;font-weight:700;color:#3f8f2a;margin-top:2px;}
  .finder-result-card .fr-price{font-size:12.5px;font-weight:800;color:var(--ink);margin-top:3px;}
  .finder-restart{
    display:block;width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;
  }
  .fr-section-divider{margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line);}

  footer{
    text-align:center;color:var(--muted);font-size:11.5px;padding:30px 16px 56px;
  }

  .color-dots{display:flex;align-items:center;gap:4px;margin-top:5px;}
  .color-dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none;}
  .color-more{font-size:9px;color:var(--muted);font-weight:700;margin-left:1px;}

  /* ---------- TECH GLOSSARY ---------- */
  .tech-term{font-weight:700;color:var(--ink);}
  .tech-info{
    display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;margin-left:2px;border-radius:50%;
    background:#eaf1ff;color:var(--blue);font-size:10px;font-weight:800;
    cursor:pointer;vertical-align:middle;line-height:1;
  }
  #techPopover{
    position:fixed;z-index:200;max-width:260px;background:var(--navy-deep);color:#fff;
    padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;
    box-shadow:0 8px 20px rgba(0,0,0,.3);display:none;
    opacity:0;transform:scale(.96);
    transition:opacity .16s var(--ease-icon),transform .16s var(--ease-icon);
  }
  #techPopover.pop-open{opacity:1;transform:scale(1);}
  #techPopover .tp-title{font-weight:800;font-size:12.5px;margin-bottom:4px;color:#8ec6ff;}
  #techPopover .tp-close{
    position:absolute;top:6px;right:8px;color:#9fb3d9;font-size:12px;cursor:pointer;
  }

  /* ---------- PRINT / SAVE AS PDF ---------- */
  @media print{
    header.top nav, header.top .searchwrap, #adminBtn, #adminOverlay, .overlay,
    #origPdfBtn, #shareBtn, #newOnlyBtn, #sortSelect, .serieswrap, #filterModeTabs{
      display:none !important;
    }
    header.top{position:static;background:#fff !important;color:var(--navy-deep);padding:6px 0;}
    header.top .brand .logo{color:var(--navy-deep) !important;-webkit-text-fill-color:var(--navy-deep);}
    header.top .header-logo img{filter:invert(1);}
    body{background:#fff;}
    main{max-width:100%;padding:0 6px;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .card{break-inside:avoid;box-shadow:none !important;border:1px solid #ddd;}
    .card:hover{box-shadow:none;}
    .empty{display:none;}
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    /* hero dismiss: drop the full-viewport slide, keep the fade */
    .hero{ transition:opacity .45s ease; }
    .hero.hide{ transform:none; opacity:0; }

    /* hero landing text: fade only, no rise */
    @keyframes heroTextIn{ from{opacity:0} to{opacity:1} }

    /* product grid card entrance: fade only, no rise */
    @keyframes cardIn{ from{opacity:0} to{opacity:1} }

    /* card hover lift: drop the translateY, keep the shadow cue */
    .card:hover{ transform:none; }

    /* compare-toggle coachmark: fade only, both directions */
    @keyframes cmpCoachIn{ from{opacity:0} to{opacity:1} }
    .cmp-coach.leaving{ transform:none; }

    /* product/compare sheet entrance: fade only, no rise/scale */
    @keyframes up{ from{opacity:0} to{opacity:1} }

    /* compare/finder panel entrance: fade only, no rise */
    @keyframes panelIn{ from{opacity:0} to{opacity:1} }

    /* trigger-anchored popovers: fade only, no scale */
    #techPopover.pop-open,#recoPopover.pop-open,#cmpAddPopover.pop-open{transform:none}
  }
</style>
</head>

<script>
/* =============== DATA =============== */
const GRAD = {
  ASTROX:'linear-gradient(135deg,#7a1e1e,#e8622c)',
  ARCSABER:'linear-gradient(135deg,#8a1420,#d43a4a)',
  NANOFLARE:'linear-gradient(135deg,#0a6b5e,#37c8b0)',
  SHOP:'linear-gradient(135deg,#555,#999)',
  JUNIOR:'linear-gradient(135deg,#1a5c3a,#8cff5c)',
  BADSTR:'linear-gradient(135deg,#0b3d91,#3fa9f5)',
  SHUTTLE:'linear-gradient(135deg,#c9b458,#efe6c0)',
  BADSHOE:'linear-gradient(135deg,#123a6b,#2f7fd1)',
  VCORE:'linear-gradient(135deg,#7a0d1d,#c8102e)',
  PERCEPT:'linear-gradient(135deg,#1b2a52,#3d5ba9)',
  EZONE:'linear-gradient(135deg,#0d3f8a,#3fa9f5)',
  ASTREL:'linear-gradient(135deg,#334155,#7c93b8)',
  TENSTR:'linear-gradient(135deg,#0b3d91,#2f7fd1)',
  TENSHOE:'linear-gradient(135deg,#123a6b,#4fae32)',
  BALL:'linear-gradient(135deg,#4fae32,#a7d96c)',
  VOLTRAGE:'linear-gradient(135deg,#7a0d1d,#c8102e)',
  GEOBREAK:'linear-gradient(135deg,#7a1e1e,#e8622c)',
  SOFT:'linear-gradient(135deg,#334155,#7c93b8)',
  ACC:'linear-gradient(135deg,#4fae32,#0b6b3a)',
  MACHINE:'linear-gradient(135deg,#374151,#0f172a)',
};

/*
  SERIES DIVIDER PHOTOS (optional)
  --------------------------------
  A banner automatically appears in the product grid every time the
  series changes (e.g. between ASTROX and ARCSABER), showing the new
  series name over its brand-color gradient. To show a real photo

function shoeInfoHasTech(info){
  if(!info) return false;
  if(info.techsBySeries) return Object.values(info.techsBySeries).some(arr=>arr.length>0);
  return !!(info.techs && info.techs.length>0);
}
function shoeSeriesHeroHtml(){
  const type = (state.cat==='bad' && state.sub==='shoe' && state.filterMode==='type') ? state.typeFilter : null;
  const info = SHOE_SERIES_INFO[type];
  if(!info) return '';
  const hasTech = shoeInfoHasTech(info);
  const tag = hasTech ? 'button' : 'div';
  const clickAttrs = hasTech ? `type="button" onclick="openShoeTechSheet('${type}')" aria-label="${info.title} 기술 자세히 보기"` : '';
  return `
    <${tag} class="ssh${hasTech?'':' ssh-static'}" style="background-image:url('${info.img}')" ${clickAttrs}>
      <div class="ssh-body">
        <h2 class="ssh-title">${info.title}</h2>
        <p class="ssh-desc">${info.desc}</p>
      </div>
      ${hasTech ? `<span class="ssh-cta">SERIES TECH <span>→</span></span>` : ''}
    </${tag}>
  `;
}
function shoeTechSheetContentHtml(type, activeSeriesKey){
  const info = SHOE_SERIES_INFO[type];
  if(!info) return '';
  const hasTabs = !!info.techsBySeries;
  const tabs = hasTabs ? info.seriesTabs : null;
  const firstWithContent = hasTabs ? (tabs.find(t=>(info.techsBySeries[t.key]||[]).length>0) || tabs[0]) : null;
  const activeKey = hasTabs ? (tabs.some(t=>t.key===activeSeriesKey) ? activeSeriesKey : firstWithContent.key) : null;
  const techs = hasTabs ? (info.techsBySeries[activeKey] || []) : (info.techs || []);
  return `
    <div class="rg-sheet">
      <button class="x floating" onclick="closeSheet()" aria-label="닫기">✕</button>
      <div class="rg-sheet-head">
        <div class="rg-sheet-head-eyebrow">SERIES TECH</div>
        <h2 class="rg-sheet-head-title">${info.title}</h2>
      </div>
      ${hasTabs ? `
      <div class="filter-mode-tabs" role="tablist" aria-label="${info.title} 시리즈 선택">
        ${tabs.map(t=>`<button type="button" role="tab" aria-selected="${t.key===activeKey}" class="${t.key===activeKey?'active':''}" onclick="switchShoeTechSeries('${type}','${t.key}')">${t.label}</button>`).join('')}
      </div>` : ''}
      <div class="rg-section" style="padding-top:16px">
        <div class="rg-section-head"><h3>KEY TECHNOLOGY</h3></div>
        ${techs.length ? `
        <div class="ssh-tech-detail-list">
          ${techs.map(t=>`
            <div class="ssh-tech-detail">
              <div class="ssh-tech-detail-img">
                <img src="${t.img}" alt="" loading="lazy" decoding="async" onerror="this.closest('.ssh-tech-detail-img').classList.add('ssh-tech-img-pending')">
              </div>
              <div class="ssh-tech-name">${t.name}</div>
              <div class="ssh-tech-kr">${t.kr}</div>
              <div class="ssh-tech-desc">${t.desc}</div>
            </div>`).join('')}
        </div>` : `<div class="empty">아직 준비중인 콘텐츠입니다.</div>`}
      </div>
    </div>
  `;
}
function openShoeTechSheet(type){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  sheet.innerHTML = shoeTechSheetContentHtml(type);
  openOverlayA11y();
  if(!overlay.classList.contains('open')){
    overlay.classList.add('open');
    history.pushState({sheetOpen:true}, '', location.href);
    sheetHistoryPushed = true;
  }
  focusSheetContent();
}
function switchShoeTechSeries(type, key){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = shoeTechSheetContentHtml(type, key);
  const activeTab = sheet.querySelector('.filter-mode-tabs button.active');
  if(activeTab) activeTab.focus({preventScroll:true});
}

  that carries over to next year doesn't need its photo re-uploaded --
  every year's catalog reads from the same file.

  column in image-checklist.csv) is ALWAYS the main/representative
  photo -- the one used as the card thumbnail AND as the first photo
  in the detail-page gallery. No "-detail"/"-thumb"/"-full" suffixes.
  Extra gallery photos just get "-2", "-3", etc. appended.
    shared-images/astrox-99-pro.jpg     <- main photo (thumbnail + gallery #1)
    shared-images/astrox-99-pro-2.jpg   <- extra gallery photo
    shared-images/astrox-99-pro-3.jpg   <- extra gallery photo

const COLOR_MAP = {
  'ruby red':'#9b1c31','dark red':'#8b1a1a','red':'#cc2733','wine red':'#bd4d5f',
  'white':'#ffffff','black':'#434143',
  'blue':'#2e71b7','deep blue':'#52658f','navy':'#1e2a4a','dark navy':'#141c33',
  'sky blue':'#7ec8e3','sax':'#8fc1e3','pale blue':'#cfe3f7',
  'green':'#71c683','dark green':'#1f5c3a','teal green':'#0f766e','citrus green':'#cada70','powder green':'#a0ada3',
  'lime':'#b9d14f','fresh lime':'#b6e23a','sunny lime':'#cdeb4a',
  'orange':'#df8e4c','sherbet orange':'#ffb37a','white orange':'#f5a35a',
  'purple':'#7c3aed','dark purple':'#8d669b','pink':'#e1a1c0','pale pink':'#fbd6e6','mist pink':'#bea9b1','pale lilac':'#a59bb1','magenta':'#c2185b',
  'brown':'#9e6e3d','mocha gray':'#8a7a6d','mocha grey':'#8a7a6d',
  'gray':'#c7c4c3','grey':'#c7c4c3','silver':'#c8ccd1','silver orange':'#e8c39a',
  'gold':'#caa64d','champagne':'#f0dfc0','khaki':'#8f8757','sand beige':'#d8c39a','beige':'#d9c9a8',
  'yellow':'#f4e04e','mint':'#8fe3c0',
};
function colorToHex(word){
  const key = (word||'').trim().toLowerCase();
  if(!key) return '#cbd5e1';
  if(COLOR_MAP[key]) return COLOR_MAP[key];
  const parts = key.split(' ');
  for(let i=parts.length-1;i>=0;i--){
    if(COLOR_MAP[parts[i]]) return COLOR_MAP[parts[i]];
  }
  return '#cbd5e1';
}
function extractColorGroups(raw){
  if(!raw) return [];
  const bracketRe = /\[(\d{4})\]\s*([^\[]*)/g;
  let m, groups = [], matched = false;
  while((m = bracketRe.exec(raw))){
    matched = true;
    const content = m[2].replace(/\/\s*$/,'').trim();
    content.split(',').map(s=>s.trim()).filter(Boolean).forEach(t=>groups.push(t));
  }
  if(!matched){
    raw.split(',').map(s=>s.trim()).filter(Boolean).forEach(t=>groups.push(t));
  }
  return groups;
}
function colorDotHtml(token){
  token = token.replace(/\/\s*$/,'').trim();
  const subs = token.split('/').map(s=>s.trim()).filter(Boolean);
  const esc = token.replace(/"/g,'&quot;');
  if(subs.length>=2){
    const c1 = colorToHex(subs[0]), c2 = colorToHex(subs[1]);
    return `<span class="color-dot" title="${esc}" style="background:linear-gradient(135deg, ${c1} 50%, ${c2} 50%);"></span>`;
  }
  const c = colorToHex(subs[0]||token);
  return `<span class="color-dot" title="${esc}" style="background:${c};"></span>`;
}
function colorDotsRow(p){
  const raw = p.specs && p.specs['색상'];
  const groups = extractColorGroups(raw);
  if(groups.length<1) return '';
  const maxDots = 4;
  const shown = groups.slice(0,maxDots).map(colorDotHtml).join('');
  const extra = groups.length>maxDots? `<span class="color-more">+${groups.length-maxDots}</span>` : '';
  return `<div class="color-dots">${shown}${extra}</div>`;
}

function applyBulkLinks(){
  const raw = document.getElementById('bulkInput').value.trim();
  if(!raw){ document.getElementById('bulkResult').textContent='붙여넣은 내용이 없어요.'; return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let okLinks=0, okImages=0, fail=[];
  lines.forEach(line=>{
    // split only on the FIRST tab (or comma if no tab) so multiple image names
    // separated by semicolons later in the value are never cut off
    const tabIdx = line.indexOf('\t');
    let key, value;
    if(tabIdx > -1){
      key = line.slice(0, tabIdx).trim();
      value = line.slice(tabIdx+1).trim();
    } else {
      const commaIdx = line.indexOf(',');
      if(commaIdx === -1){ fail.push(line); return; }
      key = line.slice(0, commaIdx).trim();
      value = line.slice(commaIdx+1).trim();
    }
    if(!key || !value){ fail.push(line); return; }
    key = key.replace(/^images\//,'').replace(/\.(jpg|jpeg|png|webp)$/i,'');
    const slug = slugify(key);
    const product = SLUG_MAP[slug];
    if(!product){ fail.push(line); return; }

    if(/^https?:\/\//i.test(value)){
      // a single URL -> Yonexmall link
      product.buyUrl = value;
      okLinks++;
    } else {
      // one or more image filenames, separated by ; (or a single one alone)
      const files = value.split(';').map(s=>s.trim()).filter(Boolean)
        .map(f=> /^https?:\/\//i.test(f) ? f : (f.startsWith('images/') ? f : 'images/'+f));
      if(files.length===0){ fail.push(line); return; }
      if(files.length===1){
        product.img = files[0];
      } else {
        product.images = files;
        product.img = files[0];
      }
      okImages++;
    }
  });
  document.getElementById('bulkResult').innerHTML =
    `✅ 링크 ${okLinks}개, 이미지 ${okImages}개 적용 완료.` +
    (fail.length? `<br>⚠️ 매칭 실패 ${fail.length}개 (파일명 확인 필요): <br>` + fail.slice(0,8).map(f=>`<code>${f}</code>`).join('<br>') : '');
  renderGrid(); // refresh so buy buttons are ready to preview immediately
}

function exportUpdatedHtml(){
  if(!ORIGINAL_HTML){ alert('페이지가 아직 완전히 로드되지 않았어요. 잠시 후 다시 시도해주세요.'); return; }
  const newArrayText = 'const P = ' + JSON.stringify(P) + ';';
  const patched = ORIGINAL_HTML.replace(/const P = \[[\s\S]*?\n\];/, newArrayText);
  if(patched === ORIGINAL_HTML){
    alert('내보내기에 실패했어요. 페이지를 새로고침한 뒤 다시 시도해주세요.');
    return;
  }
  const blob = new Blob(['<!DOCTYPE html>\n'+patched], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yonex-2026-catalog-updated.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function annotateTech(text){
  if(!text) return text;
  let allKeys = [];
  TECH_GLOSSARY.forEach((entry, idx)=>{
    entry.keys.forEach(k=> allKeys.push({key:k, idx}));
  });
  allKeys.sort((a,b)=> b.key.length - a.key.length);

  let segments = [{text: text, isTag:false}];
  allKeys.forEach(({key, idx})=>{
    const re = new RegExp(escapeRegex(key), 'gi');
    segments = segments.flatMap(seg=>{
      if(seg.isTag) return [seg];
      let out = [];
      let lastIndex = 0, m;
      re.lastIndex = 0;
      while((m = re.exec(seg.text))){
        if(m.index > lastIndex) out.push({text:seg.text.slice(lastIndex, m.index), isTag:false});
        out.push({isTag:true, html:`<span class="tech-term">${m[0]}</span><span class="tech-info" data-tech="${idx}" onclick="showTechPopover(event,${idx})">i</span>`});
        lastIndex = m.index + m[0].length;
        if(re.lastIndex === m.index) re.lastIndex++;
      }
      out.push({text:seg.text.slice(lastIndex), isTag:false});
      return out;
    });
  });
  return segments.map(s=> s.isTag? s.html : s.text).join('');
}

function showTechPopover(evt, idx){
  evt.stopPropagation();
  const entry = TECH_GLOSSARY[idx];
  const pop = document.getElementById('techPopover');
  document.getElementById('techPopoverTitle').textContent = entry.label;
  document.getElementById('techPopoverDesc').textContent = entry.desc;
  const rect = evt.target.getBoundingClientRect();
  const popW = 260;
  let left = rect.left - popW/2 + rect.width/2;
  left = Math.max(10, Math.min(left, window.innerWidth - popW - 10));
  let top = rect.bottom + 8;
  let placedAbove = false;

let state = {cat:'bad', sub:'racquet', series:'ASTROX', filterMode:'series', weightFilter:null, flexFilter:null, typeFilter:null, gaugeFilter:null, q:'', sort:'default', newOnly:false, compare:[]};

function fmtPrice(p){
  if(p.price===0){
    if(p.specs && p.specs['비고']==='대리점 전용 상품') return '대리점 전용 상품';
    if((p.c==='bad' && p.s==='shuttle') || (p.c==='ten' && p.s==='string') || p.c==='acc') return '';

  if(!p.price) return '';
  return p.price.toLocaleString('ko-KR')+'원';
}

function syncScrollFade(el){

function racquetFlex(p){
  return (p.specs && p.specs['탄성']) || null;
}
function filterModesFor(cat, sub, items){
  if(cat==='bad' && sub==='racquet'){
    const modes = [['series','시리즈']];
    if(items.some(p=>racquetWeights(p).length)) modes.push(['weight','무게']);
    if(items.some(p=>racquetFlex(p))) modes.push(['flex','탄성']);
    return modes;
  }
  if(cat==='bad' && sub==='string'){
    const modes = [];
    if(items.some(p=>stringType(p))) modes.push(['type','유형']);
    if(items.some(p=>stringGaugeBucket(stringGaugeMm(p)))) modes.push(['gauge','굵기']);
    if(modes.length) modes.push(['series','시리즈']);
    return modes;
  }
  if(cat==='bad' && sub==='shoe'){
    return [['type','유형'], ['series','시리즈']];
  }
  if(cat==='ten' && sub==='racquet'){
    return [['series','시리즈']];
  }
  if(cat==='ten' && sub==='string'){
    return [['series','시리즈']];
  }
  if(cat==='ten' && sub==='shoe'){
    return [['series','시리즈']];
  }
  if(cat==='soft' && sub==='racquet'){
    return [['series','시리즈']];
  }
  return [];
}

function renderSeriesRow(){

  const modes = filterModesFor(state.cat, state.sub, items);
  const modeIds = modes.map(m=>m[0]);
  const mode = modeIds.includes(state.filterMode) ? state.filterMode : 'series';

  if(mode==='weight'){
    const buckets = ['가벼운','보통','묵직한'].filter(w=> items.some(p=>racquetWeights(p).map(weightBucket).includes(w)));

  if(mode==='flex'){

    el.innerHTML = flexList.map(f=>`<button class="chip ${state.flexFilter===f?'active':''}" data-flex="${f}">${f}</button>`).join('');

      renderGrid();
      el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x.dataset.flex===state.flexFilter));
    });
    syncScrollFade(el);
    return;
  }
  if(mode==='type'){
    const isShoe = (state.cat==='bad' && state.sub==='shoe');
    const isString = (state.cat==='bad' && state.sub==='string');
    const typeOrder = isShoe ? ['EXPLOSIVE DRIVE','경량화','안정성','올라운드'] : ['고반발','컨트롤','내구성'];
    const typeGetter = isShoe ? shoeType : stringType;
    const typeLabel = t => isShoe ? t : STRING_TYPE_LABELS[t];
    const typeList = typeOrder.filter(t=> items.some(p=>typeGetter(p)===t));
    el.innerHTML = ((isShoe || isString) ? '' : `<button class="chip ${!state.typeFilter?'active':''}" data-type="">전체</button>`) +
      typeList.map(t=>`<button class="chip ${state.typeFilter===t?'active':''}" data-type="${t}">${typeLabel(t)}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{

      el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');

  }
  if(mode==='gauge'){
    const gaugeOrder = ['얇은','보통','두꺼운'];
    const gaugeList = gaugeOrder.filter(g=> items.some(p=>stringGaugeBucket(stringGaugeMm(p))===g));
    el.innerHTML = gaugeList.map(g=>`<button class="chip ${state.gaugeFilter===g?'active':''}" data-gauge="${g}">${g}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      state.gaugeFilter = (state.gaugeFilter===b.dataset.gauge) ? null : b.dataset.gauge;
      renderGrid();
      el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x.dataset.gauge===state.gaugeFilter));
    });
    syncScrollFade(el);
    return;
  }

  const seriesList = [...new Set(items.map(p=>p.series))];
  if(seriesList.length<=1){ el.innerHTML=''; syncScrollFade(el); return; }
  const showAllChip = !((state.cat==='bad' && (state.sub==='string' || state.sub==='shoe' || state.sub==='racquet')) || (state.cat==='ten' && (state.sub==='racquet' || state.sub==='shoe' || state.sub==='string')) || (state.cat==='soft' && state.sub==='racquet'));
  el.innerHTML = (showAllChip ? `<button class="chip ${!state.series?'active':''}" data-series="">전체</button>` : '') +
    seriesList.map(s=>`<button class="chip ${state.series===s?'active':''}" data-series="${s}">${s}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{

    renderGrid();

  });
  syncScrollFade(el);
}

function currentList(){
  let list;
  if(state.q){
    const q = state.q.toLowerCase();
    list = P.filter(p=> (p.name+p.kr+p.series).toLowerCase().includes(q));
  } else {
    list = P.filter(p=>p.c===state.cat && p.s===state.sub);
    if(state.cat==='bad' && state.sub==='racquet' && state.filterMode==='weight' && state.weightFilter){
      list = list.filter(p=>racquetWeights(p).map(weightBucket).includes(state.weightFilter));
    } else if(state.cat==='bad' && state.sub==='racquet' && state.filterMode==='flex' && state.flexFilter){
      list = list.filter(p=>racquetFlex(p)===state.flexFilter);
    } else if(state.cat==='bad' && state.sub==='string' && state.filterMode==='type' && state.typeFilter){
      list = list.filter(p=>stringType(p)===state.typeFilter);
    } else if(state.cat==='bad' && state.sub==='shoe' && state.filterMode==='type' && state.typeFilter){
      list = list.filter(p=>shoeType(p)===state.typeFilter);
    } else if(state.cat==='bad' && state.sub==='string' && state.filterMode==='gauge' && state.gaugeFilter){
      list = list.filter(p=>stringGaugeBucket(stringGaugeMm(p))===state.gaugeFilter);
    } else if(state.series){
      list = list.filter(p=>p.series===state.series);
    }
  }
  if(state.newOnly){
    list = list.filter(p=>p.badge);
  }
  if(state.sort==='desc' || state.sort==='asc'){
    list = list.slice().sort((a,b)=>{
      const av = a.price||0, bv = b.price||0;
      if(av===0 && bv===0) return 0;
      if(av===0) return 1;   // unknown price sinks to the bottom either way
      if(bv===0) return -1;
      return state.sort==='desc' ? bv-av : av-bv;
    });
  }
  return list;
}

function smapLabelTspans(name, seriesName, x, fontSize){
  const short = name.replace(new RegExp('^'+seriesName+'\\s+','i'),'').toUpperCase();
  const words = short.split(' ');
  let lines;
  if(words.length<=1){ lines=[words[0]||'']; }
  else if(words.length===2){ lines=[words[0], words[1]]; }
  else { const mid=Math.ceil(words.length/2); lines=[words.slice(0,mid).join(' '), words.slice(mid).join(' ')]; }
  const lineHeight = fontSize*1.2667;
  const startDy = fontSize*0.35-(lines.length-1)*lineHeight/2;
  return lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?startDy:lineHeight}">${l}</tspan>`).join('');
}
function smapLocalHalfWidth(y, cy, ry, rx){
  const topT=0.42, botT=0.30;
  const rel = (y-(cy-ry))/(2*ry);
  if(rel<topT){
    const t = Math.max(0,rel)/topT;
    return rx*Math.sin(t*Math.PI/2);
  }
  if(rel>1-botT){
    const t = Math.max(0,1-rel)/botT;
    return rx*Math.sin(t*Math.PI/2);
  }
  return rx;
}

    const yOff = (pos.y-0.5)*2*ry*insetY;
    const y = cy + yOff;
    const localRx = smapLocalHalfWidth(y, cy, ry, rx)*insetX;

      x: cx + (pos.x-0.5)*2*localRx,

      <text x="${x}" y="${textY}" text-anchor="middle" font-size="${fontSize}" font-weight="800" fill="${textFill}" style="${letterSpacing}">${smapLabelTspans(p.name,seriesName,x,fontSize)}</text>
    </g>`;
  }).join('');

  sheet.innerHTML = `

      <div class="smap-head">

        <image href="images/badminton%20racquet_matrix.jpg" xlink:href="images/badminton%20racquet_matrix.jpg" x="0" y="0" width="369" height="500" preserveAspectRatio="xMidYMid meet"/>
        ${bubbles}

      ${isAdmin ? `

function renderCategoryHero(){

  if(!el) return;
  const cfg = (CATEGORY_HERO[state.cat] && !state.q) ? CATEGORY_HERO[state.cat][state.sub] : null;
  if(!cfg){ el.style.display='none'; el.innerHTML=''; el.onclick=null; return; }
  el.style.display = 'flex';
  el.style.backgroundImage = `url('${cfg.img}')`;
  el.classList.toggle('rg-hero-align-right', cfg.align==='right');
  el.setAttribute('aria-label', cfg.title + ' 보기');
  el.innerHTML = `
    <div class="rg-hero-text">
      <div class="rg-hero-eyebrow">OUR RANGE OF</div>
      <h2 class="rg-hero-title">${cfg.title}</h2>
      <p class="rg-hero-desc">${cfg.desc}</p>
      ${cfg.hideCta ? '' : `<span class="rg-hero-cta">${cfg.cta} <span>→</span></span>`}
    </div>`;
  el.onclick = cfg.action;
}

      <text x="${m.x}" y="${m.y}" text-anchor="middle" font-size="6" font-weight="800" fill="#fff">${smapLabelTspans(p.name,'',m.x,6)}</text>
    </g>`;
  }).join('');
  return `
    <div class="smap-wrap">
      <div class="smap-head">

        <h2>STRING MATRIX</h2>

        <button onclick="copyStringMatrixPositions()">좌표 복사</button>
      </div>` : ''}
    </div>
  `;
}
function stringMatrixGoToCategory(cat){
  state.cat='bad'; state.sub='string'; state.filterMode='type'; state.typeFilter=cat;
  state.series=null; state.weightFilter=null; state.flexFilter=null; state.gaugeFilter=null; state.q='';
  closeSheet();
  renderAll();
  racquetGuideScrollToResults();
}
function openStringMatrixSheet(){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('cmp-mode');
  sheet.innerHTML = stringMatrixContentHtml();
  openOverlayA11y();
  if(!overlay.classList.contains('open')){
    overlay.classList.add('open');
    history.pushState({sheetOpen:true}, '', location.href);
    sheetHistoryPushed = true;
  }
  if(new URLSearchParams(location.search).get('admin')==='1') initStringMatrixDrag();
  focusSheetContent();
}
function racquetGuideScrollToResults(){
  const anchor = document.getElementById('filterModeTabs');
  if(anchor) anchor.scrollIntoView({block:'start'});
}
function racquetGuideGoToSeries(seriesKey){
  state.cat='bad'; state.sub='racquet'; state.series=seriesKey; state.q='';
  closeSheet();
  renderAll();
  racquetGuideScrollToResults();
}
function racquetGuideViewAll(){
  state.cat='bad'; state.sub='racquet'; state.series=null; state.q='';
  closeSheet();
  renderAll();
  racquetGuideScrollToResults();
}
function racquetGuideContentHtml(){
  const legendHtml = RACQUET_GUIDE_SERIES.map(s=>{
    const [balanceKo, balanceEn] = s.balance.split(' (');
    return `<button class="rg-legend-col rg-legend-col-${s.key.toLowerCase()}" onclick="racquetGuideGoToSeries('${s.key}')">
      <div class="rg-legend-name">${s.key}</div>
      <div class="rg-legend-balance"><span>${balanceKo}</span><span>(${balanceEn}</span></div>
      <div class="rg-legend-trait">${s.trait}</div>
    </button>`;
  }).join('');
  return `
    <div class="rg-sheet">
      <button class="x floating" onclick="closeSheet()" aria-label="닫기">✕</button>
      <div class="rg-sheet-head">
        <div class="rg-sheet-head-eyebrow">OUR RANGE OF</div>
        <h2 class="rg-sheet-head-title">RACQUET GUIDE</h2>
      </div>

      <div class="rg-section" id="rgSelectorSection">
        <div class="rg-section-head">
          <span class="rg-section-kicker">01</span>
          <div class="rg-section-head-text">
            <h3>RACQUET SELECTOR</h3>
            <p class="rg-section-lead">플레이 스타일에 맞는 시리즈를 확인하세요.<br>이름을 탭하면 해당 시리즈로 이동합니다.</p>
          </div>
        </div>
        <div class="rg-venn">
          ${RACQUET_SELECTOR_VENN_SVG}
          <button class="rg-venn-label rg-venn-label-left" onclick="racquetGuideGoToSeries('ASTROX')">ASTROX</button>
          <button class="rg-venn-label rg-venn-label-mid" onclick="racquetGuideGoToSeries('ARCSABER')">ARCSABER</button>
          <button class="rg-venn-label rg-venn-label-right" onclick="racquetGuideGoToSeries('NANOFLARE')">NANOFLARE</button>
        </div>
        <div class="rg-selector-legend">${legendHtml}</div>
      </div>

      <div class="rg-section" id="rgTechSection">
        <div class="rg-section-head">
          <span class="rg-section-kicker">02</span>
          <div class="rg-section-head-text">
            <h3>RACQUET TECHNOLOGY</h3>
            <p class="rg-section-lead">요넥스 라켓의 대표 기술을 소개합니다.</p>
          </div>
        </div>
        <div class="rg-iso-card">
          ${RACQUET_TECHNOLOGY_ISOMETRIC_SVG}
          <div class="rg-iso-text">
            <p class="rg-iso-full">더 넓은 스윗스팟을 위한 요넥스의 ISOMETRIC™ 기술. 독자적인 프레임 형상으로 유효 타구면을 확장해 중심을 벗어난 타구에서도 안정적인 퍼포먼스를 유지하며, 더 높은 정확성과 컨트롤을 제공합니다.</p>
            <div class="rg-iso-divider-line"></div>
            <div class="rg-iso-footnote-row">
              <span>아이소메트릭은 요넥스의 고유 기술력입니다.</span>
              <span>*요넥스 자체 테스트 결과</span>
            </div>
            <div class="rg-iso-footnote-sub">* 요넥스는 처음 테니스 라켓용으로 아이소메트릭을 개발한 후, 1992년 최초의 아이소메트릭 배드민턴 라켓을 출시했습니다.</div>
          </div>
        </div>
      </div>

        <button class="rg-cta" onclick="racquetGuideViewAll()">전체 라켓 보기 →</button>
      </div>
    </div>
  `;
}

function initSeriesMapDrag(cx, cy, rx, ry, insetX, insetY){
  const svg = document.getElementById('smapSvg');
  if(!svg) return;
  const toFrac = (x, y)=>{
    const fy = 0.5 + (y-cy)/(2*ry*insetY);
    const localRx = Math.max(6, smapLocalHalfWidth(y, cy, ry, rx)*insetX);
    const fx = 0.5 + (x-cx)/(2*localRx);
    return {x: Math.round(fx*100)/100, y: Math.round(fy*100)/100};
  };
  const svgPoint = (clientX, clientY)=>{
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    return ctm ? pt.matrixTransform(ctm.inverse()) : {x:0,y:0};
  };
  let dragging = null;
  svg.querySelectorAll('.smap-draggable').forEach(g=>{
    g.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragging = g;
      g.setPointerCapture(e.pointerId);
    });
  });
  svg.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const p = svgPoint(e.clientX, e.clientY);
    const idx = +dragging.dataset.idx;
    const frac = toFrac(p.x, p.y);
    P[idx].mapPos = frac;
    dragging.querySelector('circle').setAttribute('cx', p.x);
    dragging.querySelector('circle').setAttribute('cy', p.y);
    dragging.querySelectorAll('text tspan').forEach(t=> t.setAttribute('x', p.x));
    dragging.querySelector('text').setAttribute('y', p.y);
  });
  const stop = ()=>{ dragging = null; };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
}

function tennisMapLabelTspans(label, cx, cy, fontSize){
  const words = label.split(' ');
  const lines = (words.length===1 || label.length<=6) ? [label] : [words.slice(0,-1).join(' '), words[words.length-1]];
  const lineHeight = fontSize*1.25;
  const startY = cy - (lines.length-1)*lineHeight/2 + fontSize*0.35;
  return lines.map((l,i)=>`<tspan x="${cx}" y="${startY+i*lineHeight}">${l}</tspan>`).join('');
}
function tennisSeriesMapContentHtml(seriesName){
  const svg = TENNIS_SERIES_MAP_SVG[seriesName];
  const data = TENNIS_SERIES_MAP_DATA[seriesName];
  if(!svg || !data) return '';
  const color = TENNIS_SERIES_MAP_COLOR[seriesName];
  const r = 12.55, fontSize = 4.8;
  const isAdmin = new URLSearchParams(location.search).get('admin')==='1';
  const bubbles = data.map((pt,mi)=>{
    const p = P.find(x=>x.c==='ten' && x.s==='racquet' && x.name===pt.name);
    if(!p) return '';
    const idx = P.indexOf(p);
    const clickCall = `seriesMapShowDetail(${idx}, '${seriesName}', 'tennismap')`;
    const a11yAttrs = isAdmin ? '' : ` role="button" tabindex="0" aria-label="${p.name}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${clickCall}}"`;
    return `<g class="smap-bubble${isAdmin?' smap-draggable':''}" data-mi="${mi}" onclick="${isAdmin?'':clickCall}"${a11yAttrs}>
      <circle cx="${pt.x}" cy="${pt.y}" r="${r}" fill="${color}" stroke="#fff" stroke-width="1"/>
      <text text-anchor="middle" font-size="${fontSize}" font-weight="800" fill="#fff" font-family="'Archivo',-apple-system,BlinkMacSystemFont,sans-serif">${tennisMapLabelTspans(pt.label, pt.x, pt.y, fontSize)}</text>
    </g>`;
  }).join('');
  const adminBar = isAdmin ? `
    <div class="smap-admin-bar">
      <div class="smap-admin-hint">🔧 관리자 모드 — 버블을 드래그해서 위치를 옮긴 뒤 아래 버튼으로 좌표를 복사하세요.</div>
      <button onclick="copyTennisMapPositions('${seriesName}')">좌표 복사</button>
    </div>` : '';
  return svg.replace('</svg>', bubbles + '</svg>') + adminBar;
}
function initTennisMapDrag(seriesName){
  const sheet = document.getElementById('sheet');
  const svg = sheet.querySelector('svg.smap-svg');
  if(!svg) return;
  const data = TENNIS_SERIES_MAP_DATA[seriesName];
  const fontSize = 4.8;
  const svgPoint = (clientX, clientY)=>{
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    return ctm ? pt.matrixTransform(ctm.inverse()) : {x:0,y:0};
  };
  let dragging = null;
  svg.querySelectorAll('.smap-draggable').forEach(g=>{
    g.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragging = g;
      g.setPointerCapture(e.pointerId);
    });
  });
  svg.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const p = svgPoint(e.clientX, e.clientY);
    const mi = +dragging.dataset.mi;
    const x = Math.round(p.x*100)/100, y = Math.round(p.y*100)/100;
    data[mi].x = x;
    data[mi].y = y;
    dragging.querySelector('circle').setAttribute('cx', x);
    dragging.querySelector('circle').setAttribute('cy', y);
    dragging.querySelector('text').innerHTML = tennisMapLabelTspans(data[mi].label, x, y, fontSize);
  });
  const stop = ()=>{ dragging = null; };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
}
function copyTennisMapPositions(seriesName){
  const data = TENNIS_SERIES_MAP_DATA[seriesName];
  const text = data.map(m=>`{name:'${m.name}', label:'${m.label}', x:${m.x}, y:${m.y}},`).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=> alert('좌표를 복사했어요. 챗에 붙여넣어 주세요.'),
      ()=> prompt('아래 내용을 복사해서 챗에 붙여넣어 주세요:', text)
    );
  } else {
    prompt('아래 내용을 복사해서 챗에 붙여넣어 주세요:', text);
  }
}
