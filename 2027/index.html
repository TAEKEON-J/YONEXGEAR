<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX 2027 카탈로그 · 준비중</title>
<style>
  :root{
    --navy:#0b2a5b;
    --navy-deep:#081c3f;
    --blue:#1656c9;
    --green:#4fae32;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  a{color:inherit;text-decoration:none;}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;padding:56px 20px;
    background:
      radial-gradient(circle at 12% 18%,rgba(79,174,50,.35),transparent 45%),
      radial-gradient(circle at 88% 78%,rgba(22,86,201,.5),transparent 50%),
      linear-gradient(160deg,var(--navy-deep),var(--navy) 55%,var(--blue));
  }
  .badge-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .logo{font-weight:900;font-size:clamp(34px,9vw,48px);letter-spacing:1px;}
  .yr{
    font-size:13px;font-weight:800;background:var(--green);color:#06210a;
    padding:5px 12px;border-radius:999px;letter-spacing:.5px;
  }
  h1{font-size:clamp(20px,5vw,26px);font-weight:800;margin:4px 0 12px;line-height:1.4;}
  .sub{font-size:14.5px;color:#cfe0ff;max-width:400px;line-height:1.7;margin:0 0 36px;}
  .back{
    background:#fff;color:var(--navy-deep);font-weight:800;font-size:14px;
    padding:12px 26px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  footer{margin-top:48px;color:#9db3dd;font-size:11.5px;}
</style>
</head>
<body>
  <div class="badge-row">
    <span class="logo">YONEX</span>
    <span class="yr">2027</span>
  </div>
  <h1>2027 GEAR CATALOGUE<br>준비중입니다</h1>
  <p class="sub">2027년 제품 카탈로그는 아직 업데이트 전입니다.<br>지금은 2026 카탈로그를 확인하실 수 있어요.</p>
  <a class="back" href="../2026/">2026 카탈로그 보기 →</a>
  <footer><a href="../">← 카탈로그 아카이브로</a></footer>
</body>
</html>
