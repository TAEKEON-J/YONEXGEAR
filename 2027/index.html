<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX 2027 카탈로그</title>
<style>
  :root{
    --navy:#0b2a5b;
    --navy-deep:#081c3f;
    --blue:#1656c9;
    --green:#4fae32;
    --red:#c8102e;
    --ink:#12172a;
    --paper:#f4f6fa;
    --card:#ffffff;
    --line:#e2e6ef;
    --muted:#63697c;
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  a{color:inherit;}
  img{max-width:100%;}

  /* ---------- HERO / LANDING ---------- */
  body.hero-active{overflow:hidden;}
  .hero{
    position:fixed;inset:0;z-index:300;overflow-y:auto;isolation:isolate;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;padding:48px 20px 70px;
    background:
      radial-gradient(circle at 12% 18%,rgba(79,174,50,.35),transparent 45%),
      radial-gradient(circle at 88% 78%,rgba(22,86,201,.5),transparent 50%),
      linear-gradient(160deg,var(--navy-deep),var(--navy) 55%,var(--blue));
    transition:transform .55s cubic-bezier(.65,0,.35,1), opacity .45s ease;
  }
  .hero.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
  .hero::before{
    content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
    background-image:repeating-radial-gradient(circle at 50% 0%,rgba(255,255,255,.05) 0 2px,transparent 2px 42px);
  }
  .hero-shuttle{position:absolute;opacity:.14;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3));pointer-events:none;z-index:-1;}
  .hero-shuttle.s1{width:150px;top:8%;left:-30px;transform:rotate(-18deg);}
  .hero-shuttle.s2{width:110px;bottom:10%;right:-20px;transform:rotate(24deg);}
  .hero-badge-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .hero-logo{font-weight:900;font-size:clamp(36px,9vw,52px);letter-spacing:1px;}
  .hero-yr{font-size:13px;font-weight:800;background:var(--green);color:#06210a;padding:5px 12px;border-radius:999px;letter-spacing:.5px;}
  .hero-title{font-size:clamp(20px,5.5vw,28px);font-weight:800;line-height:1.35;margin:4px 0 12px;max-width:480px;}
  .hero-sub{font-size:14.5px;color:#cfe0ff;max-width:420px;line-height:1.65;margin-bottom:10px;}
  .hero-stats{font-size:12.5px;color:#9db3dd;margin-bottom:30px;}
  .hero-cta{
    background:#fff;color:var(--navy-deep);font-weight:800;font-size:15px;
    padding:14px 30px;border-radius:999px;border:none;cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:36px;
  }
  .hero-cats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:460px;}
  .hero-cats button{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;
    padding:9px 17px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .hero-cats button:hover{background:rgba(255,255,255,.22);}
  .hero-scroll{
    position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.65);font-size:20px;letter-spacing:.1em;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    animation:bob 1.8s ease-in-out infinite;
    background:none;border:none;cursor:pointer;padding:8px;
  }
  @keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,7px);}}
  @media print{ .hero{display:none !important;} }

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky;top:0;z-index:50;overflow:hidden;
    background:linear-gradient(120deg,var(--navy-deep),var(--navy) 55%,var(--blue));
    color:#fff;
    padding:44px 20px 0;
    box-shadow:0 6px 18px rgba(8,20,45,.25);
  }
  header.top .header-photo{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
  }
  header.top .header-overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(120deg,rgba(8,20,63,.62),rgba(11,42,91,.55) 55%,rgba(22,86,201,.5));
  }
  header.top .brandrow, header.top .searchwrap, header.top nav.cats, header.top nav.subcats{
    position:relative;z-index:2;
  }
  .brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;}
  .brand .logo{font-weight:800;font-size:22px;letter-spacing:.5px;}
  .brand .yr{
    font-size:11.5px;background:var(--green);color:#06210a;font-weight:800;
    padding:4px 9px;border-radius:20px;letter-spacing:.5px;line-height:1;
    display:inline-flex;align-items:center;
  }
  .header-logo{flex:0 0 auto;display:flex;align-items:center;}
  .header-logo img{height:20px;width:auto;display:block;}
  @media(max-width:400px){.header-logo img{height:16px;}}
  .searchwrap{margin:30px 0 18px;}
  .searchbox{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    border-radius:999px;padding:15px 20px;
  }
  .searchbox input{
    background:transparent;border:none;outline:none;color:#fff;font-size:16px;width:100%;
  }
  .searchbox input::placeholder{color:#c5cfe6;}
  .searchbox svg{flex:none;opacity:.8;}

  nav.cats{
    display:flex;gap:8px;overflow-x:auto;padding:0 0 16px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats button{
    flex:none;white-space:nowrap;
    background:rgba(255,255,255,.08);color:#dbe4fa;border:1px solid rgba(255,255,255,.18);
    padding:10px 19px;border-radius:999px;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  nav.cats button.active{background:#fff;color:var(--navy-deep);border-color:#fff;}

  nav.subcats{
    display:flex;gap:8px;overflow-x:auto;padding:0 0 16px;margin-top:-2px;
    scrollbar-width:none;
  }
  nav.subcats::-webkit-scrollbar{display:none;}
  nav.subcats button{
    flex:none;white-space:nowrap;background:transparent;color:#aebbdd;
    border:none;padding:7px 5px;font-size:14px;font-weight:600;cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.subcats button.active{color:#fff;border-bottom-color:var(--green);}

  /* ---------- SERIES CHIPS ---------- */
  .serieswrap{padding:12px 16px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .serieswrap::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
    background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  main{padding:14px 16px 60px;max-width:1100px;margin:0 auto;}

  .section-title{
    font-size:13px;font-weight:800;color:var(--navy);text-transform:uppercase;
    letter-spacing:.06em;margin:22px 2px 10px;display:flex;align-items:center;gap:8px;
  }
  .section-title .bar{width:16px;height:3px;background:var(--green);border-radius:2px;}
  .count{color:var(--muted);font-size:12px;text-align:right;margin:6px 2px 0;}

  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:scale(.97);}
  .card:hover{box-shadow:0 6px 16px rgba(20,40,90,.12);}
  .card .thumb{
    aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;position:relative;overflow:hidden;
  }
  .card .thumb .thumb-icon-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;width:100%;height:100%;padding:8px;
  }
  .card .thumb svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .card .thumb .thumb-label{font-size:11px;font-weight:800;letter-spacing:.03em;opacity:.9;}
  .sheet-hero svg{width:76px;height:76px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));}
  .badge-new{
    display:inline-flex;white-space:nowrap;flex:none;
    background:#fff;color:#7c3aed;border:1.2px solid #7c3aed;
    border-radius:999px;font-size:8.1px;font-weight:800;letter-spacing:-.01em;
    padding:2.2px 7.2px;
  }
  .badge-new.design{color:var(--blue);border-color:var(--blue);}
  .card-top{position:relative;}
  .card .series-tag{font-size:10.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;}
  .card .name{font-size:14px;font-weight:800;line-height:1.25;color:var(--ink);text-transform:uppercase;}
  .card .kr{font-size:11.5px;color:var(--muted);}
  .card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
  .card .meta span{
    font-size:10px;background:#eef1f8;color:var(--muted);padding:2px 6px;border-radius:6px;font-weight:600;
  }
  .card .price{margin-top:auto;font-size:13.5px;font-weight:800;color:var(--navy-deep);}
  .card .price small{font-weight:600;color:var(--muted);font-size:10.5px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
  }

  /* ---------- SERIES DIVIDER ---------- */
  .series-divider{
    grid-column:1 / -1;position:relative;overflow:hidden;
    border-radius:var(--radius);min-height:240px;
    display:flex;align-items:center;justify-content:center;
    margin:8px 0 0;color:#fff;text-align:center;
  }
  .series-divider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .series-divider .sd-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.32),rgba(0,0,0,.1));}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,15,35,.55);z-index:100;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.open{display:flex;}
  @media(min-width:720px){.overlay{align-items:center;}}
  .sheet{
    background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;
    max-height:88vh;overflow-y:auto;padding:0 0 24px;position:relative;
    animation:up .18s ease-out;
  }
  @media(min-width:720px){.sheet{border-radius:20px;max-height:80vh;}}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:none;}
  .x.floating{
    position:absolute;top:14px;right:14px;z-index:5;
    border:none;background:rgba(255,255,255,.9);color:var(--ink);width:34px;height:34px;border-radius:50%;
    font-size:16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);
  }
  .sheet-hero{
    width:100%;aspect-ratio:1/1;border-radius:20px 20px 0 0;
    display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;
  }
  @media(min-width:720px){.sheet-hero{border-radius:20px 20px 0 0;}}
  .sheet-body{padding:18px 18px 16px;}
  .sheet-body h2{font-size:19px;margin:0 0 2px;color:var(--ink);text-transform:uppercase;}
  .sheet-body .kr-full{color:var(--muted);font-size:13px;margin-bottom:10px;}
  .sheet-body .price-full{font-size:18px;font-weight:800;color:var(--navy-deep);margin:8px 0 14px;}
  .sheet-body .desc{font-size:13.5px;line-height:1.6;color:#333;background:var(--paper);padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  table.specs{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;}
  table.specs tr{border-bottom:1px solid var(--line);}
  table.specs td{padding:8px 4px;vertical-align:top;word-break:break-word;overflow-wrap:anywhere;}
  table.specs td:first-child{color:var(--muted);width:34%;font-weight:600;}
  table.specs td:last-child{font-weight:600;color:var(--ink);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .tags span{font-size:11px;background:#eaf1ff;color:var(--blue);padding:4px 9px;border-radius:8px;font-weight:700;}

  footer{
    text-align:center;color:var(--muted);font-size:11.5px;padding:30px 16px 40px;
  }

  .color-dots{display:flex;align-items:center;gap:3px;margin-top:1px;}
  .color-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none;}
  .color-more{font-size:9px;color:var(--muted);font-weight:700;margin-left:1px;}

  /* ---------- TECH GLOSSARY ---------- */
  .tech-term{font-weight:700;color:var(--ink);}
  .tech-info{
    display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;margin-left:2px;border-radius:50%;
    background:#eaf1ff;color:var(--blue);font-size:10px;font-weight:800;
    cursor:pointer;vertical-align:middle;line-height:1;
  }
  #techPopover{
    position:fixed;z-index:200;max-width:260px;background:var(--navy-deep);color:#fff;
    padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;
    box-shadow:0 8px 20px rgba(0,0,0,.3);display:none;
  }
  #techPopover .tp-title{font-weight:800;font-size:12.5px;margin-bottom:4px;color:#8ec6ff;}
  #techPopover .tp-close{
    position:absolute;top:6px;right:8px;color:#9fb3d9;font-size:12px;cursor:pointer;
  }

  /* ---------- PRINT / SAVE AS PDF ---------- */
  @media print{
    header.top nav, header.top .searchwrap, #adminBtn, #adminOverlay, .overlay,
    #origPdfBtn, #newOnlyBtn, #sortSelect, .serieswrap{
      display:none !important;
    }
    header.top{position:static;background:#fff !important;color:var(--navy-deep);padding:6px 0;}
    header.top .brand .logo{color:var(--navy-deep) !important;-webkit-text-fill-color:var(--navy-deep);}
    header.top .header-logo img{filter:invert(1);}
    body{background:#fff;}
    main{max-width:100%;padding:0 6px;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .card{break-inside:avoid;box-shadow:none !important;border:1px solid #ddd;}
    .card:hover{box-shadow:none;}
    .empty{display:none;}
  }
</style>
</head>
<body>

<section class="hero" id="heroSection">
  <svg class="hero-shuttle s1" viewBox="0 0 100 140" fill="none"><path d="M50 90 L20 20 M50 90 L35 15 M50 90 L50 12 M50 90 L65 15 M50 90 L80 20" stroke="#fff" stroke-width="2"/><circle cx="50" cy="98" r="12" fill="#fff"/></svg>
  <svg class="hero-shuttle s2" viewBox="0 0 100 140" fill="none"><path d="M50 90 L20 20 M50 90 L35 15 M50 90 L50 12 M50 90 L65 15 M50 90 L80 20" stroke="#fff" stroke-width="2"/><circle cx="50" cy="98" r="12" fill="#fff"/></svg>
  <a href="../" class="hero-badge-row" style="text-decoration:none;">
    <span class="hero-logo">YONEX</span>
    <span class="hero-yr">2027</span>
  </a>
  <h1 class="hero-title">2027 GEAR CATALOGUE</h1>
  <p class="hero-sub">요넥스 용품 디지털 카탈로그</p>
  <p class="hero-stats" id="heroCount">전체 제품 · 실시간 검색 지원</p>
  <button class="hero-cta" onclick="scrollToCatalog()">카탈로그 보기 ↓</button>
  <div class="hero-cats" id="heroCatBtns"></div>
  <button class="hero-scroll" onclick="scrollToCatalog()" aria-label="카탈로그 보기">▾</button>
</section>

<header class="top">
  <img class="header-photo" src="images/header-banner.jpg" alt="" onerror="this.remove()">
  <div class="header-overlay"></div>
  <div class="brandrow">
    <a href="../" class="brand" style="text-decoration:none;">
      <span class="logo">YONEX</span>
      <span class="yr">2027</span>
    </a>
    <div class="header-logo" style="gap:8px;"></div>
  </div>
  <div class="searchwrap">
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="제품명, 모델명으로 검색 (예: 아스트록스, VCORE)">
    </div>
  </div>
  <nav class="cats" id="catNav"></nav>
  <nav class="subcats" id="subNav"></nav>
</header>

<div class="serieswrap" id="seriesRow"></div>

<main>
  <div class="section-title" id="sectionTitle"><span class="bar"></span><span id="sectionTitleText">전체 제품</span></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;gap:8px;">
    <div class="count" id="countLabel" style="margin:0;"></div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button id="newOnlyBtn" style="font-size:12.5px;font-weight:700;color:var(--muted);
        background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;">
        🆕 신상품만
      </button>
      <select id="sortSelect" style="font-size:12.5px;font-weight:700;color:var(--navy);
        background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px;">
        <option value="default">상품 정렬</option>
        <option value="desc">가격 높은순</option>
        <option value="asc">가격 낮은순</option>
      </select>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">검색 결과가 없습니다. 다른 키워드로 시도해 보세요.</div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<button id="adminBtn" onclick="openAdmin()"
  style="position:fixed;right:16px;bottom:16px;z-index:60;background:var(--navy);color:#fff;
         border:none;border-radius:999px;padding:12px 18px;font-weight:800;font-size:13px;
         box-shadow:0 6px 18px rgba(8,20,45,.35);cursor:pointer;">
  🔗📷 링크·이미지 일괄 등록
</button>

<div class="overlay" id="adminOverlay">
  <div class="sheet" id="adminSheet"></div>
</div>

<div id="techPopover"><span class="tp-close" onclick="closeTechPopover()">✕</span><div class="tp-title" id="techPopoverTitle"></div><div id="techPopoverDesc"></div></div>

<footer>YONEX 2027 Product Catalog · 웹 열람용으로 재구성된 비공식 요약본 · 정확한 정보는 원본 카탈로그 및 요넥스 공식 채널을 참고하세요.</footer>

<script>
/* =============== DATA =============== */
const GRAD = {
  ASTROX:'linear-gradient(135deg,#7a1e1e,#e8622c)',
  ARCSABER:'linear-gradient(135deg,#8a1420,#d43a4a)',
  NANOFLARE:'linear-gradient(135deg,#0a6b5e,#37c8b0)',
  SHOP:'linear-gradient(135deg,#555,#999)',
  BADSTR:'linear-gradient(135deg,#0b3d91,#3fa9f5)',
  SHUTTLE:'linear-gradient(135deg,#c9b458,#efe6c0)',
  BADSHOE:'linear-gradient(135deg,#123a6b,#2f7fd1)',
  VCORE:'linear-gradient(135deg,#7a0d1d,#c8102e)',
  PERCEPT:'linear-gradient(135deg,#1b2a52,#3d5ba9)',
  EZONE:'linear-gradient(135deg,#0d3f8a,#3fa9f5)',
  ASTREL:'linear-gradient(135deg,#334155,#7c93b8)',
  TENSTR:'linear-gradient(135deg,#0b3d91,#2f7fd1)',
  TENSHOE:'linear-gradient(135deg,#123a6b,#4fae32)',
  BALL:'linear-gradient(135deg,#4fae32,#a7d96c)',
  VOLTRAGE:'linear-gradient(135deg,#7a0d1d,#c8102e)',
  GEOBREAK:'linear-gradient(135deg,#7a1e1e,#e8622c)',
  SOFT:'linear-gradient(135deg,#334155,#7c93b8)',
  ACC:'linear-gradient(135deg,#4fae32,#0b6b3a)',
  MACHINE:'linear-gradient(135deg,#374151,#0f172a)',
};

/*
  SERIES DIVIDER PHOTOS (optional)
  --------------------------------
  A banner automatically appears in the product grid every time the
  series changes (e.g. between ASTROX and ARCSABER), showing the new
  series name over its brand-color gradient. To show a real photo
  there instead, add a file to the "images" folder and register it
  here using the exact series name as the key, e.g.:
    ASTROX: 'images/series-astrox.jpg',
  Missing/typo'd paths just fall back to the gradient, so nothing breaks.
*/
const SERIES_BANNERS = {
  ARCSABER: 'images/series-arcsaber.jpg',
  NANOFLARE: 'images/series-nanoflare.jpg',
  'SHOP EXCLUSIVE': 'images/series-shop-exclusive.jpg',
  // ASTROX: 'images/series-astrox.jpg',
};

const CATS = [

/* =============== COLOR DOTS (tennis shoes with multiple colorways) =============== */
const COLOR_MAP = {
  'ruby red':'#9b1c31','dark red':'#8b1a1a','red':'#d0342c',
  'white':'#ffffff','black':'#111111',
  'blue':'#2563eb','navy':'#1e2a4a','dark navy':'#141c33',
  'sky blue':'#7ec8e3','sax':'#8fc1e3','pale blue':'#cfe3f7',
  'green':'#2e8b57','dark green':'#1f5c3a','teal green':'#0f766e',
  'lime':'#a3d63f','fresh lime':'#b6e23a','sunny lime':'#cdeb4a',
  'orange':'#f0632a','sherbet orange':'#ffb37a','white orange':'#f5a35a',
  'purple':'#7c3aed','pink':'#f4a6c6','pale pink':'#fbd6e6',
  'brown':'#6b4a34','mocha gray':'#8a7a6d','mocha grey':'#8a7a6d',
  'gray':'#9aa0a8','grey':'#9aa0a8','silver':'#c8ccd1','silver orange':'#e8c39a',
  'gold':'#caa64d','champagne':'#f0dfc0','khaki':'#8f8757','sand beige':'#d8c39a',
  'yellow':'#f2d024','mint':'#8fe3c0',
};
function colorToHex(word){
  const key = (word||'').trim().toLowerCase();
  if(!key) return '#cbd5e1';
  if(COLOR_MAP[key]) return COLOR_MAP[key];
  const parts = key.split(' ');
  for(let i=parts.length-1;i>=0;i--){
    if(COLOR_MAP[parts[i]]) return COLOR_MAP[parts[i]];
  }
  return '#cbd5e1';
}
function extractColorGroups(raw){
  if(!raw) return [];
  const bracketRe = /\[(\d{4})\]\s*([^\[]*)/g;
  let m, groups = [], matched = false;
  while((m = bracketRe.exec(raw))){
    matched = true;
    const content = m[2].replace(/\/\s*$/,'').trim();
    content.split(',').map(s=>s.trim()).filter(Boolean).forEach(t=>groups.push(t));
  }
  if(!matched){
    raw.split(',').map(s=>s.trim()).filter(Boolean).forEach(t=>groups.push(t));
  }
  return groups;
}
function colorDotHtml(token){
  token = token.replace(/\/\s*$/,'').trim();
  const subs = token.split('/').map(s=>s.trim()).filter(Boolean);
  const esc = token.replace(/"/g,'&quot;');
  if(subs.length>=2){
    const c1 = colorToHex(subs[0]), c2 = colorToHex(subs[1]);
    return `<span class="color-dot" title="${esc}" style="background:linear-gradient(135deg, ${c1} 50%, ${c2} 50%);"></span>`;
  }
  const c = colorToHex(subs[0]||token);
  return `<span class="color-dot" title="${esc}" style="background:${c};"></span>`;
}
function colorDotsRow(p){
  const eligible = p.s==='shoe' || p.s==='racquet' || (p.c==='ten' && p.s==='string');
  if(!eligible) return '';
  const raw = p.specs && p.specs['색상'];
  const groups = extractColorGroups(raw);
  if(groups.length<2) return '';
  const maxDots = 4;
  const shown = groups.slice(0,maxDots).map(colorDotHtml).join('');
  const extra = groups.length>maxDots? `<span class="color-more">+${groups.length-maxDots}</span>` : '';
  return `<div class="color-dots">${shown}${extra}</div>`;
}

function applyBulkLinks(){
  const raw = document.getElementById('bulkInput').value.trim();
  if(!raw){ document.getElementById('bulkResult').textContent='붙여넣은 내용이 없어요.'; return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let okLinks=0, okImages=0, fail=[];
  lines.forEach(line=>{
    // split only on the FIRST tab (or comma if no tab) so multiple image names
    // separated by semicolons later in the value are never cut off
    const tabIdx = line.indexOf('\t');
    let key, value;
    if(tabIdx > -1){
      key = line.slice(0, tabIdx).trim();
      value = line.slice(tabIdx+1).trim();
    } else {
      const commaIdx = line.indexOf(',');
      if(commaIdx === -1){ fail.push(line); return; }
      key = line.slice(0, commaIdx).trim();
      value = line.slice(commaIdx+1).trim();
    }
    if(!key || !value){ fail.push(line); return; }
    key = key.replace(/^images\//,'').replace(/\.(jpg|jpeg|png|webp)$/i,'');
    const slug = slugify(key);
    const product = SLUG_MAP[slug];
    if(!product){ fail.push(line); return; }

    if(/^https?:\/\//i.test(value)){
      // a single URL -> Yonexmall link
      product.buyUrl = value;
      okLinks++;
    } else {
      // one or more image filenames, separated by ; (or a single one alone)
      const files = value.split(';').map(s=>s.trim()).filter(Boolean)
        .map(f=> /^https?:\/\//i.test(f) ? f : (f.startsWith('images/') ? f : 'images/'+f));
      if(files.length===0){ fail.push(line); return; }
      if(files.length===1){
        product.img = files[0];
      } else {
        product.images = files;
        product.img = files[0];
      }
      okImages++;
    }
  });
  document.getElementById('bulkResult').innerHTML =
    `✅ 링크 ${okLinks}개, 이미지 ${okImages}개 적용 완료.` +
    (fail.length? `<br>⚠️ 매칭 실패 ${fail.length}개 (파일명 확인 필요): <br>` + fail.slice(0,8).map(f=>`<code>${f}</code>`).join('<br>') : '');
  renderGrid(); // refresh so buy buttons are ready to preview immediately
}

function exportUpdatedHtml(){
  if(!ORIGINAL_HTML){ alert('페이지가 아직 완전히 로드되지 않았어요. 잠시 후 다시 시도해주세요.'); return; }
  const newArrayText = 'const P = ' + JSON.stringify(P) + ';';
  const patched = ORIGINAL_HTML.replace(/const P = \[[\s\S]*?\n\];/, newArrayText);
  if(patched === ORIGINAL_HTML){
    alert('내보내기에 실패했어요. 페이지를 새로고침한 뒤 다시 시도해주세요.');
    return;
  }
  const blob = new Blob(['<!DOCTYPE html>\n'+patched], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yonex-2027-catalog-updated.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function annotateTech(text){
  if(!text) return text;
  let allKeys = [];
  TECH_GLOSSARY.forEach((entry, idx)=>{
    entry.keys.forEach(k=> allKeys.push({key:k, idx}));
  });
  allKeys.sort((a,b)=> b.key.length - a.key.length);

  let segments = [{text: text, isTag:false}];
  allKeys.forEach(({key, idx})=>{
    const re = new RegExp(escapeRegex(key), 'gi');
    segments = segments.flatMap(seg=>{
      if(seg.isTag) return [seg];
      let out = [];
      let lastIndex = 0, m;
      re.lastIndex = 0;
      while((m = re.exec(seg.text))){
        if(m.index > lastIndex) out.push({text:seg.text.slice(lastIndex, m.index), isTag:false});
        out.push({isTag:true, html:`<span class="tech-term">${m[0]}</span><span class="tech-info" data-tech="${idx}" onclick="showTechPopover(event,${idx})">i</span>`});
        lastIndex = m.index + m[0].length;
        if(re.lastIndex === m.index) re.lastIndex++;
      }
      out.push({text:seg.text.slice(lastIndex), isTag:false});
      return out;
    });
  });
  return segments.map(s=> s.isTag? s.html : s.text).join('');
}

function showTechPopover(evt, idx){
  evt.stopPropagation();
  const entry = TECH_GLOSSARY[idx];
  const pop = document.getElementById('techPopover');
  document.getElementById('techPopoverTitle').textContent = entry.label;
  document.getElementById('techPopoverDesc').textContent = entry.desc;
  const rect = evt.target.getBoundingClientRect();
  const popW = 260;
  let left = rect.left - popW/2 + rect.width/2;
  left = Math.max(10, Math.min(left, window.innerWidth - popW - 10));
  let top = rect.bottom + 8;
  if(top > window.innerHeight - 100) top = rect.top - 90;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.display = 'block';
}
function closeTechPopover(){
  document.getElementById('techPopover').style.display = 'none';
}
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('techPopover');
  if(pop.style.display === 'block' && !pop.contains(e.target) && !e.target.classList.contains('tech-info')){
    closeTechPopover();
  }
});

/* =============== STATE =============== */
let state = {cat:'bad', sub:'racquet', series:null, q:'', sort:'default', newOnly:false};

/* =============== RENDER =============== */
function fmtPrice(p){
  if(!p) return '';
  return p.toLocaleString('ko-KR')+'원';
}

function renderCatNav(){
  const el = document.getElementById('catNav');
  el.innerHTML = CATS.map(c=>`<button data-cat="${c.id}" class="${c.id===state.cat?'active':''}">${c.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.cat=b.dataset.cat; state.sub=SUBCATS[state.cat][0].id; state.series=null; state.q='';
    document.getElementById('searchInput').value='';
    renderAll();
  });
}
function renderSubNav(){
  const el = document.getElementById('subNav');
  const subs = SUBCATS[state.cat];
  el.innerHTML = subs.map(s=>`<button data-sub="${s.id}" class="${s.id===state.sub?'active':''}">${s.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.sub=b.dataset.sub; state.series=null; renderAll();
  });
}
function renderSeriesRow(){
  const el = document.getElementById('seriesRow');
  if(state.q){ el.innerHTML=''; return; }
  const items = P.filter(p=>p.c===state.cat && p.s===state.sub);
  const seriesList = [...new Set(items.map(p=>p.series))];
  if(seriesList.length<=1){ el.innerHTML=''; return; }
  el.innerHTML = `<button class="chip ${!state.series?'active':''}" data-series="">전체</button>` +
    seriesList.map(s=>`<button class="chip ${state.series===s?'active':''}" data-series="${s}">${s}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    state.series = b.dataset.series || null; renderGrid();
    el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
}

function currentList(){
  let list;
  if(state.q){
    const q = state.q.toLowerCase();
    list = P.filter(p=> (p.name+p.kr+p.series).toLowerCase().includes(q));
  } else {
    list = P.filter(p=>p.c===state.cat && p.s===state.sub);
    if(state.series) list = list.filter(p=>p.series===state.series);
  }
  if(state.newOnly){
    list = list.filter(p=>p.badge);
  }
  if(state.sort==='desc' || state.sort==='asc'){
    list = list.slice().sort((a,b)=>{
      const av = a.price||0, bv = b.price||0;
      if(av===0 && bv===0) return 0;
      if(av===0) return 1;   // unknown price sinks to the bottom either way
      if(bv===0) return -1;
      return state.sort==='desc' ? bv-av : av-bv;
    });
  }
  return list;
}

function renderGrid(){
  const list = currentList();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyMsg');
  document.getElementById('countLabel').textContent = list.length + '개 제품';
  document.getElementById('sectionTitleText').textContent = state.q
    ? `"${state.q}" 검색 결과`
    : (CATS.find(c=>c.id===state.cat).label + ' · ' + SUBCATS[state.cat].find(s=>s.id===state.sub).label);

  if(list.length===0){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  const showDividers = !state.q && !state.series && state.sort==='default';
  let lastSeries = null;
  grid.innerHTML = list.map((p,idx)=>{
    let divider = '';
    if(showDividers && p.series!==lastSeries){
      if(lastSeries!==null) divider = seriesDividerHtml(p.series);
      lastSeries = p.series;
    }
    return divider + `
    <div class="card" data-idx="${P.indexOf(p)}">
      <div class="card-top">
        <div class="thumb" style="background:${p.grad}">${thumbContent(p)}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;gap:4px 6px;">
        <div class="series-tag">${p.series}</div>
        ${p.badge?`<span class="badge-new${p.badge.includes('DESIGN')?' design':''}">${p.badge}</span>`:''}
      </div>
      <div class="name">${p.name}</div>
      <div class="kr">${p.kr}</div>
      <div class="meta">${metaTags(p)}</div>
      ${colorDotsRow(p)}
      <div class="price">${fmtPrice(p.price)}${p.price?'<small> 소비자가</small>':''}</div>
    </div>
  `;
  }).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    card.onclick = ()=> openSheet(P[card.dataset.idx]);
  });
}

function seriesDividerHtml(series){
  const grad = GRAD[series] || GRAD.SHOP;
  const banner = SERIES_BANNERS[series];
  return `<div class="series-divider" style="background:${grad}">
    ${banner?`<img src="${banner}" alt="${series}" onerror="this.remove()">`:''}
    <div class="sd-overlay"></div>
  </div>`;
}

function formatMetaValue(v){
  const weightMatches = v.match(/\d+U/g);
  if(weightMatches && weightMatches.length>1){
    return [...new Set(weightMatches)].join('/');
  }
  return v.split(',')[0].split('(')[0].trim();
}
function metaTags(p){
  const rules = {
    'bad|racquet': ['무게/그립','색상','원산지'],
    'bad|shoe':    ['사이즈','색상'],
    'ten|racquet': ['헤드사이즈','무게','색상'],
    'ten|shoe':    ['사이즈','코트타입','색상'],
  };
  const keys = rules[p.c+'|'+p.s] || Object.keys(p.specs).slice(0,2);
  return keys
    .filter(k=>p.specs[k])
    .map(k=>`<span>${formatMetaValue(p.specs[k])}</span>`)
    .join('');
}

function renderAll(){
  renderCatNav(); renderSubNav(); renderSeriesRow(); renderGrid();
}

/* =============== HERO / LANDING =============== */
function scrollToCatalog(){
  const hero = document.getElementById('heroSection');
  if(!hero || hero.classList.contains('hide')) return;
  hero.classList.add('hide');
  document.body.classList.remove('hero-active');
  window.scrollTo(0,0);
  setTimeout(()=>{ hero.style.display='none'; }, 600);
}
function renderHero(){
  const countEl = document.getElementById('heroCount');
  if(countEl) countEl.textContent = `전체 ${P.length}개 제품 · 실시간 검색 지원`;
  const el = document.getElementById('heroCatBtns');
  if(!el) return;
  el.innerHTML = CATS.map(c=>`<button data-cat="${c.id}">${c.label}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.cat = b.dataset.cat; state.sub = SUBCATS[state.cat][0].id; state.series=null; state.q='';
    document.getElementById('searchInput').value='';
    renderAll();
    scrollToCatalog();
  });
}
document.body.classList.add('hero-active');
renderHero();

function galleryList(p){
  if(Array.isArray(p.images) && p.images.length) return p.images;
  const arr = [];
  if(p.imgDetail) arr.push(p.imgDetail);
  if(p.img && p.img!==p.imgDetail) arr.push(p.img);
  return arr;
}
function galleryStripHtml(p){
  const imgs = galleryList(p);
  if(imgs.length<2) return '';
  return `<div style="display:flex;gap:6px;overflow-x:auto;padding:10px 18px 0;">
    ${imgs.map((src,i)=>`<img src="${src}" onclick="setHeroImage('${src}',this)"
      style="width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none;cursor:pointer;
      border:2px solid ${i===0?'var(--navy)':'transparent'};" class="gallery-thumb">`).join('')}
  </div>`;
}
function setHeroImage(src, thumbEl){
  const hero = document.getElementById('sheetHeroImg');
  if(hero) hero.src = src;
  document.querySelectorAll('.gallery-thumb').forEach(t=> t.style.border = '2px solid transparent');
  if(thumbEl) thumbEl.style.border = '2px solid var(--navy)';
}
function openSheet(p){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const rows = Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${(p.c==='acc'||k==='색상') ? String(v) : annotateTech(String(v))}</td></tr>`).join('');
  sheet.innerHTML = `
    <button class="x floating" onclick="closeSheet()">✕</button>
    <div class="sheet-hero" style="background:${p.grad};overflow:hidden;">${sheetHeroContent(p)}</div>
    ${galleryStripHtml(p)}
    <div class="sheet-body">
      ${p.badge?`<span class="badge-new${p.badge.includes('DESIGN')?' design':''}" style="margin-bottom:8px;">${p.badge}</span><br>`:''}
      <h2>${p.name}</h2>
      <div class="kr-full">${p.kr}</div>
      <div class="price-full">${fmtPrice(p.price)}</div>
      <div class="desc">${p.desc}</div>
      <table class="specs">${rows}</table>
      <div class="tags">${(p.tags||[]).map(t=>`<span>#${t}</span>`).join('')}</div>
      ${buyButtonHtml(p)}
    </div>
  `;
  overlay.classList.add('open');
}
function buyButtonHtml(p){
  if(!p.buyUrl) return '';
  return `<a href="${p.buyUrl}" target="_blank" rel="noopener"
            style="display:block;text-align:center;background:var(--navy);color:#fff;
                   font-weight:800;font-size:14px;padding:12px;border-radius:10px;
                   text-decoration:none;margin-top:14px;">요넥스몰에서 보기 →</a>`;
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});

document.getElementById('searchInput').addEventListener('input', e=>{
  state.q = e.target.value.trim();
  renderSeriesRow();
  renderGrid();
});
document.getElementById('sortSelect').addEventListener('change', e=>{
  state.sort = e.target.value;
  renderGrid();
});
const newOnlyBtn = document.getElementById('newOnlyBtn');
newOnlyBtn.addEventListener('click', ()=>{
  state.newOnly = !state.newOnly;
  newOnlyBtn.style.background = state.newOnly ? 'var(--navy)' : '#fff';
  newOnlyBtn.style.color = state.newOnly ? '#fff' : 'var(--muted)';
  newOnlyBtn.style.borderColor = state.newOnly ? 'var(--navy)' : 'var(--line)';
  renderGrid();
});

renderAll();
</script>
