<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX GEAR CATALOGUE ARCHIVE</title>
<style>
  :root{
    --navy:#0b2a5b;
    --navy-deep:#081c3f;
    --blue:#1656c9;
    --green:#4fae32;
    --ink:#12172a;
    --muted:#63697c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  a{color:inherit;text-decoration:none;}

  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;padding:56px 20px;
    background:
      radial-gradient(circle at 12% 18%,rgba(79,174,50,.35),transparent 45%),
      radial-gradient(circle at 88% 78%,rgba(22,86,201,.5),transparent 50%),
      linear-gradient(160deg,var(--navy-deep),var(--navy) 55%,var(--blue));
    position:relative;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:repeating-radial-gradient(circle at 50% 0%,rgba(255,255,255,.05) 0 2px,transparent 2px 42px);
  }

  .badge-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
  .logo{font-weight:900;font-size:clamp(34px,9vw,48px);letter-spacing:1px;}
  .archive-tag{
    font-size:12px;font-weight:800;background:rgba(255,255,255,.14);color:#dbe4fa;
    padding:5px 12px;border-radius:999px;letter-spacing:.08em;border:1px solid rgba(255,255,255,.25);
  }
  h1{font-size:clamp(20px,5vw,26px);font-weight:800;margin:4px 0 10px;line-height:1.4;}
  .sub{font-size:14.5px;color:#cfe0ff;max-width:420px;line-height:1.65;margin:0 0 40px;}

  .years{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px;}
  .year-card{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
    border-radius:16px;padding:20px 22px;transition:background .15s ease,transform .15s ease;
  }
  .year-card.live:hover{background:rgba(255,255,255,.16);transform:translateY(-2px);}
  .year-card .yr-left{text-align:left;}
  .year-card .yr-num{font-size:26px;font-weight:900;letter-spacing:.02em;}
  .year-card .yr-label{font-size:12px;color:#aebbdd;font-weight:600;margin-top:2px;}
  .year-card .yr-action{
    font-size:13px;font-weight:800;white-space:nowrap;flex:none;
    display:inline-flex;align-items:center;gap:4px;
  }
  .year-card.live .yr-action{color:#fff;}
  .year-card.soon{opacity:.6;cursor:default;}
  .year-card.soon .yr-action{
    font-size:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    padding:4px 10px;border-radius:999px;color:#dbe4fa;
  }

  footer{margin-top:48px;color:#9db3dd;font-size:11.5px;line-height:1.7;}
</style>
</head>
<body>

  <div class="badge-row">
    <span class="logo">YONEX</span>
    <span class="archive-tag">CATALOGUE ARCHIVE</span>
  </div>
  <h1>GEAR CATALOGUE</h1>
  <p class="sub">연도를 선택하시면 해당 연도의 용품 카탈로그로 이동합니다.</p>

  <div class="years" id="yearList"></div>

  <footer>YONEX GEAR CATALOGUE ARCHIVE<br>웹 열람용으로 재구성된 비공식 요약본 · 정확한 정보는 요넥스 공식 채널을 참고하세요.</footer>

<script>
/*
  HOW TO ADD A NEW YEAR
  ----------------------
  1. Duplicate the "2026" folder (or build a fresh one) into a new folder
     named after the year, e.g. "2027/", with its own index.html.
  2. Add a line below, e.g. {year:2027, href:'2027/', status:'live'}.
  3. Save — the new year appears here automatically, newest first.
  status: 'live' = clickable, goes straight to that year's catalog.
          'soon' = shown as "준비중", still links through so nothing 404s,
                   but visually marked as not ready yet.
*/
const YEARS = [
  {year:2026, href:'2026/', status:'live'},
  {year:2027, href:'2027/', status:'soon'},
];

const el = document.getElementById('yearList');
el.innerHTML = YEARS.slice().sort((a,b)=>b.year-a.year).map(y=>`
  <a class="year-card ${y.status}" href="${y.href}">
    <div class="yr-left">
      <div class="yr-num">${y.year}</div>
      <div class="yr-label">GEAR CATALOGUE</div>
    </div>
    <div class="yr-action">${y.status==='live' ? '카탈로그 보기 →' : '준비중'}</div>
  </a>
`).join('');
</script>
</body>
</html>
