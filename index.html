<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>YONEX GEAR CATALOGUE ARCHIVE</title>
<meta name="description" content="요넥스 배드민턴·테니스 용품 디지털 카탈로그 아카이브 — 연도별 카탈로그를 선택해 전체 상품을 검색하고 비교하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="YONEX GEAR CATALOGUE ARCHIVE">
<meta property="og:description" content="요넥스 배드민턴·테니스 용품 디지털 카탈로그 아카이브">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='69' font-family='Arial,sans-serif' font-weight='900' font-size='58' fill='%238cff5c' text-anchor='middle'>Y</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;
    --muted:#8a8a8a;
    --lime:#8cff5c;
    --ease:cubic-bezier(.22,1,.36,1);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  a{color:inherit;text-decoration:none;}

  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#fff;padding:56px 20px;
    background:linear-gradient(180deg,#000000,#141414);
    position:relative;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:repeating-radial-gradient(circle at 50% 0%,rgba(255,255,255,.035) 0 2px,transparent 2px 42px);
  }

  .badge-row{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px;}
  .logo{width:clamp(150px,40vw,210px);height:auto;display:block;}
  .archive-tag{
    font-size:11.5px;font-weight:800;background:var(--lime);color:#06210a;
    padding:6px 14px;border-radius:999px;letter-spacing:.08em;
  }
  h1{font-size:clamp(22px,5.5vw,30px);font-weight:900;margin:4px 0 5px;line-height:1.3;text-transform:uppercase;letter-spacing:-.01em;}
  .sub{font-size:14.5px;color:#a8a8a8;max-width:420px;line-height:1.7;margin:0 0 44px;}

  .years{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px;}
  .year-card{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:#fff;border:1px solid #fff;
    border-radius:10px;padding:22px 24px;transition:transform .15s ease,box-shadow .15s ease;
  }
  .year-card.live:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.35);}
  .year-card.live:active{transform:translateY(0) scale(.98);}
  :focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
  .year-card .yr-left{text-align:left;}
  .year-card .yr-num{font-size:28px;font-weight:900;letter-spacing:-.01em;color:var(--ink);}
  .year-card .yr-label{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
  .year-card .yr-action{
    font-size:13px;font-weight:800;white-space:nowrap;flex:none;
    display:inline-flex;align-items:center;gap:4px;
  }
  .year-card.live .yr-action{color:var(--ink);}
  .year-card.soon{background:transparent;border:1px solid rgba(255,255,255,.25);cursor:default;}
  .year-card.soon .yr-num, .year-card.soon .yr-label{color:#fff;opacity:.55;}
  .year-card.soon .yr-action{
    font-size:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
    padding:4px 10px;border-radius:999px;color:#dbdbdb;
  }

  footer{margin-top:52px;color:#767676;font-size:11.5px;line-height:1.7;}

  @keyframes textIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .badge-row{animation:textIn .7s var(--ease) both;}
  h1{animation:textIn .7s var(--ease) .1s both;}
  .sub{animation:textIn .7s var(--ease) .2s both;}
  .years{animation:textIn .7s var(--ease) .3s both;}
  footer{animation:textIn .7s var(--ease) .4s both;}
</style>
</head>
<body>

  <div class="badge-row">
    <img class="logo" src="shared-images/yonex_logo.png" alt="YONEX">
    <span class="archive-tag">CATALOGUE ARCHIVE</span>
  </div>
  <h1>Gear Catalogue</h1>
  <p class="sub">연도를 선택하시면 해당 연도의 용품 카탈로그로 이동합니다.</p>

  <div class="years" id="yearList"></div>

  <footer>YONEX GEAR CATALOGUE ARCHIVE<br>웹 열람용으로 재구성된 비공식 요약본 · 정확한 정보는 요넥스 공식 채널을 참고하세요.</footer>

<script>
/*
  HOW TO ADD A NEW YEAR
  ----------------------
  1. Duplicate the "2026" folder (or build a fresh one) into a new folder
     named after the year, e.g. "2027/", with its own index.html.
  2. Add a line below, e.g. {year:2027, href:'2027/', status:'live'}.
  3. Save — the new year appears here automatically, newest first.
  status: 'live' = clickable, goes straight to that year's catalog.
          'soon' = shown as "준비중", still links through so nothing 404s,
                   but visually marked as not ready yet.
*/
const YEARS = [
  {year:2026, href:'2026/', status:'live'},
  {year:2027, href:'2027/', status:'soon'},
];

const el = document.getElementById('yearList');
el.innerHTML = YEARS.slice().sort((a,b)=>b.year-a.year).map(y=>`
  <a class="year-card ${y.status}" href="${y.href}">
    <div class="yr-left">
      <div class="yr-num">${y.year}</div>
      <div class="yr-label">GEAR CATALOGUE</div>
    </div>
    <div class="yr-action">${y.status==='live' ? '카탈로그 보기 →' : '준비중'}</div>
  </a>
`).join('');
</script>
</body>
</html>
